// Run from Android Studio's Gradle tool window with:
// --no-configuration-cache -I tools/generate-launcher-icons.gradle :app:generateLauncherIcons
// Uses only the JDK image APIs; the original artwork stays unchanged.
import java.awt.Color
import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('generateLauncherIcons') {
        doLast {
            def sourceFile = new File(gradle.rootProject.projectDir, 'app-icon.png')
            def source = ImageIO.read(sourceFile)
            if (source == null) throw new GradleException('Cannot decode app-icon.png')
            def background = new Color(source.getRGB(0, 0))
            def res = new File(app.projectDir, 'src/main/res')
            def render = { int size, boolean round, boolean foreground, File output ->
                def image = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
                def g = image.createGraphics()
                g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
                g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                g.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
                if (round) g.setClip(new java.awt.geom.Ellipse2D.Double(0, 0, size, size))
                if (!foreground) {
                    g.setColor(background)
                    g.fillRect(0, 0, size, size)
                }
                // Adaptive artwork stays inside the central 66dp safe area of 108dp.
                int width = Math.round(size * (foreground ? 0.60f : 0.86f))
                int height = Math.round(width * source.height / (float) source.width)
                g.drawImage(source, (int)((size - width) / 2), (int)((size - height) / 2), width, height, null)
                g.dispose()
                output.parentFile.mkdirs()
                if (!ImageIO.write(image, 'png', output)) throw new GradleException('PNG encoder unavailable')
            }
            ['mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192].each { density, size ->
                render(size, false, false, new File(res, "mipmap-${density}/crossword_launcher.png"))
                render(size, true, false, new File(res, "mipmap-${density}/crossword_launcher_round.png"))
            }
            render(432, false, true, new File(res, 'drawable-nodpi/crossword_launcher_foreground.png'))
            println 'Generated 10 legacy launcher icons and the adaptive foreground.'
            println String.format('Background color: #%06X', background.getRGB() & 0xFFFFFF)
        }
    }
}
