<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f5d8a">
<meta name="color-scheme" content="light dark">
<title>Crossword Time</title>
<style>:root {
  --bg: #f4efe6; --ink: #22262e; --muted: #6a6f7a; --panel: #fffdf8; --line: #d9d1c2;
  --brand: #2f5d8a; --brand-ink: #fff; --mine: #1f5fa8; --theirs: #c4551d; --ok: #2e8b57;
  --clue-bg: #e7dfd0; --clue-ink: #2b2f38; --blank: #b9b2a3; --focus: #fff1b8; --pend: #dff0ff; --given-bg: #ece4d2; --given-ink: #4a4f5a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171a20; --ink: #eceff4; --muted: #9aa1ad; --panel: #232832; --line: #3a4150; --brand: #6fa3d8; --brand-ink: #10151c;
    --mine: #7fb6ff; --theirs: #ff9a62; --clue-bg: #343b49; --clue-ink: #e9edf3; --blank: #11141a; --focus: #5a4d1c; --pend: #26435e; --given-bg: #2d3442; --given-ink: #b8c0cd; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overscroll-behavior: none; }
#app { height: 100dvh; max-width: 560px; margin: 0 auto; position: relative; overflow: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: 0.45; cursor: default; }
.screen { height: 100%; display: flex; flex-direction: column; padding: 8px 8px max(10px, env(safe-area-inset-bottom)); }

/* home */
.home { align-items: center; justify-content: center; gap: 10px; padding: 24px 20px; }
.title { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-bottom: 4px; }
.title .row { display: flex; gap: 6px; }
.tt { width: 52px; height: 52px; display: grid; place-items: center; font-weight: 800; font-size: 28px; border-radius: 10px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.tt.sm { width: 32px; height: 38px; font-size: 19px; border-radius: 7px; } .tt.lg { margin-top: 2px; }
.title .row { gap: 4px; } .title .row:last-child { gap: 6px; }
.tt.t0 { background: #2f5d8a; color: #fff; } .tt.t1 { background: #e3a72f; color: #2b2208; } .tt.t2 { background: #c4551d; color: #fff; }
.tag { color: var(--muted); margin: 0 0 14px; }
.menu { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
.row2 { display: flex; gap: 8px; } .row2 .btn { flex: 1; padding: 10px 4px; font-size: 14px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; font-weight: 600; }
.btn.big { padding: 15px 16px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.btn.big small { color: var(--muted); font-weight: 500; font-size: 13px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.danger { background: #b3382c; border-color: #b3382c; color: #fff; justify-content: center; }
.btn.ghost { background: transparent; }
.chk { color: var(--ok); font-weight: 800; }

/* game */
.top { display: flex; align-items: center; gap: 6px; }
.icon.mute { font-size: 18px; }
.icon.mute.off { opacity: .6; }
.icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 22px; line-height: 1; }
.scorebar { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.sc { display: flex; flex-direction: column; align-items: center; min-width: 74px; padding: 3px 8px; border-radius: 10px; border: 2px solid transparent; }
.sc small { font-size: 11px; color: var(--muted); } .sc strong { font-size: 20px; line-height: 1.1; }
.sc.me strong { color: var(--mine); } .sc.them strong { color: var(--theirs); }
.sc.active { border-color: var(--line); background: var(--panel); }
.turn { text-align: center; font-weight: 700; font-size: 13px; display: flex; flex-direction: column; } .turn small { color: var(--muted); font-weight: 500; font-size: 11px; }
.turn.think { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.boardwrap { flex: 1; min-height: 0; display: grid; place-items: center; }
.board { --cell: min(calc((100vw - 28px - 2px * var(--cols)) / var(--cols)), calc((100dvh - 270px - 2px * var(--rows)) / var(--rows)), 62px); display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); grid-template-rows: repeat(var(--rows), var(--cell)); gap: 2px; padding: 3px; background: var(--line); border-radius: 8px; }
.cell { width: var(--cell); height: var(--cell); border: 0; padding: 0; border-radius: 3px; position: relative; overflow: hidden; }
.cell.blank { background: var(--blank); }
.cell.clue { background: var(--clue-bg); color: var(--clue-ink); display: flex; flex-direction: column; cursor: pointer; }
.part { position: relative; flex: 1; display: grid; place-items: center; padding: 1px 2px; min-height: 0; text-align: center; line-height: 1.04; font-size: calc(var(--cell) * 0.165); font-weight: 600; overflow-wrap: break-word; hyphens: auto; }
.cell.two .part { font-size: calc(var(--cell) * 0.135); } .cell.two .part + .part { border-top: 1px solid rgba(0,0,0,.18); }
.part .pic { font-size: calc(var(--cell) * 0.5); line-height: 1; } .cell.two .part .pic { font-size: calc(var(--cell) * 0.36); }
.part .txt { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.moon-tile, .turning-dancer { display: inline-block; position: relative; vertical-align: middle; }
.moon-tile { width: 1.15em; height: 1.05em; border-radius: .18em; background: #142343; overflow: hidden; }
.moon-tile::before { content: ''; position: absolute; width: .67em; height: .67em; left: .36em; top: .09em; border-radius: 50%; box-shadow: -.13em .12em 0 .015em white; }
.turning-dancer { padding: 0 .13em .22em; line-height: 1; }
.turning-dancer::after { content: '⟳'; position: absolute; color: #245883; font: bold 1.12em/1 sans-serif; left: 50%; bottom: -.28em; transform: translateX(-50%) scale(1.16,.56); }
.part .pic.number-pic { font-size: calc(var(--cell) * .22); white-space: nowrap; }
.clue-drawing { display: inline-block; width: 1em; height: 1em; color: #2f6175; vertical-align: -.12em; }
.part .pic.pair-pic { font-size: calc(var(--cell) * .32); white-space: nowrap; }
.cell.two .part .pic.pair-pic { font-size: calc(var(--cell) * .265); }
.inline-pic { font-size: 1.4em; line-height: 1; }
.cell.two .part .txt { -webkit-line-clamp: 2; }
.arr { position: absolute; font-style: normal; font-size: calc(var(--cell) * 0.2); color: var(--brand); opacity: .95; }
.arr.A { right: 0; top: 50%; transform: translateY(-50%); } .arr.D { bottom: -1px; left: 50%; transform: translateX(-50%); }
.part.A { padding-right: calc(var(--cell) * 0.15); } .part.D { padding-bottom: calc(var(--cell) * 0.17); }
.part.fin { opacity: .45; } .part.foc { background: rgba(255, 215, 90, .45); }
.cell.letter { background: var(--panel); font-weight: 800; font-size: calc(var(--cell) * 0.55); color: var(--ink); display: grid; place-items: center; }
.cell.letter.focus { background: var(--focus); }
.cell.letter.pend { background: var(--pend); color: var(--brand); outline: 2px solid var(--brand); outline-offset: -2px; }
.cell.letter.given { background: var(--given-bg); color: var(--given-ink); }
.cell.letter.given.focus { background: var(--focus); }
.cell.letter.auto { color: var(--theirs); opacity: .8; animation: pop .25s ease-out; }
.cell.letter.mine { color: var(--mine); } .cell.letter.theirs { color: var(--theirs); }
.cell.letter.mine, .cell.letter.theirs { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.7); } to { transform: scale(1); } }
/* feedback: newly correct squares flash light green; wrong squares are marked red */
.cell.letter.flash-ok { animation: okflash 1.8s ease-out, pop .25s ease-out; z-index: 2; }
@keyframes okflash {
  0% { background: #b6ffc8; box-shadow: 0 0 0 0 rgba(61, 220, 132, .9), inset 0 0 16px #5ef08f; }
  18% { background: #8dffa8; box-shadow: 0 0 16px 5px rgba(61, 220, 132, .95), inset 0 0 14px #3ddc84; }
  60% { background: #b6ffc8; box-shadow: 0 0 12px 3px rgba(61, 220, 132, .6), inset 0 0 10px #5ef08f; }
}
.cell.letter.flash-word { animation: wordflash 1.8s ease-out; z-index: 2; }
@keyframes wordflash {
  0%, 55% { background: #9dffb4; outline: 3px solid #2bc46a; outline-offset: -3px; box-shadow: 0 0 14px 4px rgba(61, 220, 132, .85); }
  100% { outline-color: transparent; }
}
.cell.letter.bad { background: #e5484d; color: #fff; animation: badmark 2s ease-out, shake .45s; z-index: 2; }
.cell.letter.bad::after { content: '\2715'; position: absolute; top: 1px; right: 3px; font-size: calc(var(--cell) * 0.26); font-weight: 800; }
@keyframes badmark { 0%, 70% { background: #e5484d; color: #fff; box-shadow: 0 0 10px 2px rgba(229, 72, 77, .8); } 100% { background: var(--panel); color: var(--panel); box-shadow: none; } }
@keyframes shake { 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.coin { position: fixed; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #7a5200; background: radial-gradient(circle at 35% 30%, #fff3b0, #f5c518 55%, #c99300); border: 2px solid #b07d00; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); opacity: 0; }
.cell.hint { animation: glow 1s infinite; } @keyframes glow { 50% { box-shadow: inset 0 0 0 3px #e3a72f; } }
.bottom { height: 176px; display: flex; flex-direction: column; justify-content: flex-end; flex: none; }
.cluebar.msg { background: #1d232d; color: #fff; border-color: #1d232d; font-weight: 600; text-align: center; align-items: center; }
.dock { margin: 4px 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; gap: 8px; animation: fade .15s; }
.dock-title { font-size: 19px; font-weight: 800; } .dock-sub { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
.dock-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; } .dock-btns .btn { flex: 1; padding: 13px 8px; } .btn.chip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.cluebar { min-height: 46px; padding: 6px 10px; margin: 4px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; justify-content: center; font-size: 14px; }
.cluebar.tip { color: var(--muted); font-size: 13px; } .cluebar b { font-size: 12px; color: var(--brand); }
.rack { display: flex; justify-content: center; gap: 5px; padding: 4px 0 6px; }
.rack.wait { opacity: .55; pointer-events: none; }
.tile { width: 44px; height: 50px; border-radius: 9px; border: 0; background: #e3a72f; color: #2b2208; font-weight: 800; font-size: 25px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.tile.empty { background: transparent; box-shadow: none; border: 2px dashed var(--line); }
.tile.sel { transform: translateY(-6px); background: #f3c14e; outline: 3px solid var(--brand); }
.tile.hinted { animation: glow 1s infinite; }
.rack .tile { touch-action: none; }
.tile.drag-source { opacity: .35; }
.tile.drag-ghost { position: fixed; transform: translate(-50%, -110%); display: grid; place-items: center; pointer-events: none; z-index: 100; }
.cell.letter.drop-target { outline: 3px solid var(--brand); outline-offset: -3px; background: var(--focus); }
.actions { display: flex; gap: 6px; } .actions .btn { flex: 1; padding: 11px 2px; font-size: 14px; } .actions .btn.primary { flex: 1.4; }

/* overlays */
.overlay { position: absolute; inset: 0; background: rgba(10, 14, 20, .55); display: flex; align-items: flex-end; justify-content: center; z-index: 10; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-height: 88dvh; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 18px 18px max(18px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(40px); } }
.sheet h2 { margin: 0; font-size: 21px; } .list { display: flex; flex-direction: column; gap: 10px; }
.prose p { margin: 0 0 10px; line-height: 1.45; font-size: 15px; } .small { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.stats { width: 100%; border-collapse: collapse; } .stats td { padding: 9px 4px; border-bottom: 1px solid var(--line); } .stats td + td { text-align: right; font-weight: 700; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 8px 2px; } .toggle input { width: 22px; height: 22px; }
.final { display: flex; justify-content: center; gap: 36px; padding: 6px 0 10px; } .final div { display: flex; flex-direction: column; align-items: center; } .final strong { font-size: 40px; } .final small { color: var(--muted); }
.toast { position: absolute; left: 12px; right: 12px; top: 64px; padding: 10px 14px; border-radius: 12px; background: #1d232d; color: #fff; font-size: 14px; text-align: center; z-index: 20; animation: fade .15s; pointer-events: none; }
@media (max-height: 640px) { .tile { width: 40px; height: 44px; font-size: 22px; } .cluebar { min-height: 38px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

/* mascot */
.mascot { display: block; height: 100%; width: auto; overflow: visible; }
.mascot [data-m], .mascot [data-prop] { display: none; }
.mascot[data-face="happy"] [data-m~="happy"], .mascot[data-face="cheer"] [data-m~="cheer"], .mascot[data-face="sad"] [data-m~="sad"],
.mascot[data-face="cry"] [data-m~="cry"], .mascot[data-face="puzzled"] [data-m~="puzzled"] { display: inline; }
.mascot[data-prop="thumb"] [data-prop="thumb"], .mascot[data-prop="why"] [data-prop="why"] { display: inline; }
.mascot .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.mascot .tear { animation: tear .8s linear infinite; } .mascot .tear:nth-of-type(2) { animation-delay: .35s; }
@keyframes tear { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .95; } 100% { transform: translateY(18px); opacity: 0; } }
.stage { height: 168px; margin: 4px 0; display: flex; align-items: stretch; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; animation: fade .15s; cursor: pointer; }
.stage .mbox, .dock.with-mascot .mbox { width: 134px; flex: none; height: 168px; overflow: hidden; }
.stage .cap { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 8px 12px 8px 0; }
.stage .ttl { font-size: 20px; font-weight: 800; line-height: 1.15; } .stage .sub { color: var(--muted); font-size: 14px; } .stage .tap { color: var(--muted); font-size: 11px; margin-top: 4px; }
.stage.sob .ttl { color: #2b6fb8; }
.stage.cry .ttl { color: #2b6fb8; } .stage.dance .ttl { color: var(--ok); }
.dock.with-mascot { flex-direction: row; padding: 0; gap: 8px; height: 168px; overflow: hidden; align-items: stretch; }
.dock.with-mascot .dock-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 8px 12px 8px 0; }
.dock.with-mascot .dock-title { font-size: 17px; } .dock.with-mascot .dock-sub { font-size: 13px; }
.dock.with-mascot .dock-btns .btn { padding: 11px 4px; font-size: 14px; }
</style>

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  fn.getState = () => a;
  fn.setState = (s) => {
    a = s | 0;
  };
  return fn;
}

function randInt(rng, n) {
  return Math.floor(rng() * n);
}

function pickOne(rng, arr) {
  return arr[randInt(rng, arr.length)];
}

function shuffleInPlace(rng, arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = randInt(rng, i + 1);
    const t = arr[i];
    arr[i] = arr[j];
    arr[j] = t;
  }
  return arr;
}

// ---- generator.js
// Scandinavian-style (arrowword) grid generator.
// Rules: every answer starts in the cell right after a clue cell (to the right for ACROSS,
// below for DOWN). A clue cell can carry up to two clues (one across, one down).
// Any run of 2+ letters in a row or column must be exactly one placed answer.

const TIERS = [
  { rows: 8, cols: 6, density: 0.46 },
  { rows: 9, cols: 7, density: 0.48 },
  { rows: 10, cols: 7, density: 0.5 },
  { rows: 11, cols: 8, density: 0.5 },
];

function tierFor(i) {
  return TIERS[Math.max(0, Math.min(TIERS.length - 1, i | 0))];
}

function makeIndex(words, maxLen, pictureMix) {
  const list = [];
  for (const w of words) {
    const word = w[0];
    if (word.length >= 3 && word.length <= maxLen) list.push({ word, clue: w[1], pic: w[2] || '', withText: w[4] === 1, paired: w[4] === 2 });
  }
  const byLetter = new Map();
  const illustrated = new Map();
  const written = new Map();
  list.forEach((e, i) => {
    for (let p = 0; p < e.word.length; p++) {
      const ch = e.word[p];
      if (!byLetter.has(ch)) byLetter.set(ch, []);
      const occurrence = [i, p];
      byLetter.get(ch).push(occurrence);
      if (pictureMix) {
        const bucket = e.pic ? illustrated : written;
        if (!bucket.has(ch)) bucket.set(ch, []);
        bucket.get(ch).push(occurrence);
      }
    }
  });
  return { list, byLetter, illustrated, written, pictureMix };
}

function runsAreValid(kind, rows, cols, hasKey) {
  for (let r = 0; r < rows; r++) {
    let c = 0;
    while (c < cols) {
      if (kind[r * cols + c] === 1) {
        const s = c;
        while (c < cols && kind[r * cols + c] === 1) c++;
        if (c - s >= 2 && !hasKey('A' + r + ',' + s + ',' + (c - s))) return false;
      } else c++;
    }
  }
  for (let c = 0; c < cols; c++) {
    let r = 0;
    while (r < rows) {
      if (kind[r * cols + c] === 1) {
        const s = r;
        while (r < rows && kind[r * cols + c] === 1) r++;
        if (r - s >= 2 && !hasKey('D' + s + ',' + c + ',' + (r - s))) return false;
      } else r++;
    }
  }
  return true;
}

function tryGenerate(index, rows, cols, density, rng) {
  const n = rows * cols;
  const st = {
    kind: new Uint8Array(n), // 0 empty, 1 letter, 2 clue
    ch: new Array(n).fill(''),
    noL: new Uint8Array(n), // cell may not hold a letter (end-of-word guard)
    slotA: new Int16Array(n).fill(-1),
    slotD: new Int16Array(n).fill(-1),
    entries: [],
    used: new Set(),
    keys: new Set(),
    letters: 0,
  };

  let picturesPlaced = 0;
  function tryPlace(e, r, c, dir) {
    const dr = dir === 'D' ? 1 : 0;
    const dc = dir === 'A' ? 1 : 0;
    const len = e.word.length;
    if (r < 0 || c < 0 || r + dr * (len - 1) >= rows || c + dc * (len - 1) >= cols) return false;
    const cr = r - dr;
    const cc = c - dc;
    if (cr < 0 || cc < 0) return false;
    const ci = cr * cols + cc;
    if (st.kind[ci] === 1) return false;
    if ((dir === 'A' ? st.slotA[ci] : st.slotD[ci]) !== -1) return false;
    let overlap = 0;
    for (let i = 0; i < len; i++) {
      const idx = (r + dr * i) * cols + (c + dc * i);
      const k = st.kind[idx];
      if (k === 2) return false;
      if (k === 1) {
        if (st.ch[idx] !== e.word[i]) return false;
        overlap++;
      } else if (st.noL[idx]) return false;
    }
    if (st.entries.length > 0 && (overlap === 0 || overlap === len)) return false;
    const er = r + dr * len;
    const ec = c + dc * len;
    const endInside = er < rows && ec < cols;
    if (endInside && st.kind[er * cols + ec] === 1) return false;

    const kind = st.kind.slice();
    const ch = st.ch.slice();
    const noL = st.noL.slice();
    const slotA = st.slotA.slice();
    const slotD = st.slotD.slice();
    kind[ci] = 2;
    const entryIdx = st.entries.length;
    if (dir === 'A') slotA[ci] = entryIdx;
    else slotD[ci] = entryIdx;
    let added = 0;
    for (let i = 0; i < len; i++) {
      const idx = (r + dr * i) * cols + (c + dc * i);
      if (kind[idx] !== 1) {
        kind[idx] = 1;
        ch[idx] = e.word[i];
        added++;
      }
    }
    if (endInside && kind[er * cols + ec] === 0) noL[er * cols + ec] = 1;
    const key = dir + r + ',' + c + ',' + len;
    if (!runsAreValid(kind, rows, cols, (k) => k === key || st.keys.has(k))) return false;

    st.kind = kind;
    st.ch = ch;
    st.noL = noL;
    st.slotA = slotA;
    st.slotD = slotD;
    st.keys.add(key);
    st.used.add(e.word);
    st.letters += added;
    if (e.pic) picturesPlaced++;
    st.entries.push({ word: e.word, clue: e.clue, pic: e.pic, withText: e.withText, paired: e.paired, r, c, dir, cr, cc, len });
    return true;
  }

  // First answer: across, near the top-left.
  const maxFirst = cols - 1;
  const firstPool = index.list.filter((e) => e.word.length >= 4 && e.word.length <= maxFirst);
  if (!firstPool.length) return null;
  const firstPictures = index.pictureMix ? firstPool.filter(e => e.pic) : [];
  const starters = firstPictures.length ? firstPictures : firstPool;
  for (let t = 0; t < 30 && st.entries.length === 0; t++) {
    tryPlace(pickOne(rng, starters), 1 + randInt(rng, 2), 1, 'A');
  }
  if (!st.entries.length) return null;

  const minEntries = Math.round(n / 7);
  for (let i = 0; i < 1400; i++) {
    if (st.letters / n >= density && st.entries.length >= minEntries) break;
    // pick a random existing letter cell and a word crossing it
    let idx;
    for (let t = 0; t < 12; t++) {
      idx = randInt(rng, n);
      if (st.kind[idx] === 1) break;
      idx = -1;
    }
    if (idx < 0) continue;
    const letter = st.ch[idx];
    let opts = index.byLetter.get(letter);
    if (index.pictureMix) {
      // Steer toward two illustrated clues per written clue while allowing either to fit.
      const belowTarget = picturesPlaced * 3 < st.entries.length * 2;
      const picture = rng() < (belowTarget ? 0.9 : 0.1);
      opts = (picture ? index.illustrated : index.written).get(letter) || opts;
    }
    if (!opts) continue;
    const [wi, p] = pickOne(rng, opts);
    const e = index.list[wi];
    if (st.used.has(e.word)) continue;
    const r = Math.floor(idx / cols);
    const c = idx % cols;
    const dirs = rng() < 0.5 ? ['A', 'D'] : ['D', 'A'];
    for (const dir of dirs) {
      const r0 = dir === 'D' ? r - p : r;
      const c0 = dir === 'A' ? c - p : c;
      if (tryPlace(e, r0, c0, dir)) break;
    }
  }
  return st;
}

function finalize(st, rows, cols, seed, tier) {
  const cells = [];
  const cellEntries = [];
  for (let i = 0; i < rows * cols; i++) {
    cellEntries.push([]);
    if (st.kind[i] === 1) cells.push({ t: 'L', ch: st.ch[i] });
    else if (st.kind[i] === 2) cells.push({ t: 'C', a: st.slotA[i], d: st.slotD[i] });
    else cells.push({ t: 'B' });
  }
  const entries = st.entries.map((e, id) => {
    const dr = e.dir === 'D' ? 1 : 0;
    const dc = e.dir === 'A' ? 1 : 0;
    const idxs = [];
    for (let i = 0; i < e.len; i++) {
      const idx = (e.r + dr * i) * cols + (e.c + dc * i);
      idxs.push(idx);
      cellEntries[idx].push(id);
    }
    return { id, word: e.word, clue: e.clue, pic: e.pic, withText: e.withText, paired: e.paired, dir: e.dir, r: e.r, c: e.c, cr: e.cr, cc: e.cc, len: e.len, cells: idxs };
  });
  return { rows, cols, cells, entries, cellEntries, seed, tier, letterCount: st.letters, density: st.letters / (rows * cols) };
}

function generatePuzzle(words, seed, tier, pictureMix = true) {
  const t = tierFor(tier);
  const index = makeIndex(words, Math.max(t.rows, t.cols) - 1, pictureMix);
  let best = null;
  for (let attempt = 0; attempt < 60; attempt++) {
    const rng = createRng((Math.imul(seed | 0, 2654435761) + attempt * 40503 + 12345) >>> 0);
    const st = tryGenerate(index, t.rows, t.cols, t.density, rng);
    if (!st) continue;
    if (!best || st.letters > best.letters) best = st;
    if (st.letters / (t.rows * t.cols) >= t.density) {
      best = st;
      break;
    }
  }
  if (!best) throw new Error('Could not generate a puzzle');
  return finalize(best, t.rows, t.cols, seed, Math.max(0, Math.min(TIERS.length - 1, tier | 0)));
}

// ---- game.js
// Turn-based game rules: letter rack, placement, scoring, hints and the AI opponent.


const RACK_SIZE = 7;
const MAX_HINTS = 3;
const DIFFICULTIES = {
  easy: { tier: 0, skill: 0.4, given: 0.5, simple: true, label: 'Easy' },
  medium: { tier: 1, skill: 0.65, given: 0.32, label: 'Medium' },
  hard: { tier: 2, skill: 0.82, given: 0.25, label: 'Hard' },
  expert: { tier: 3, skill: 0.92, given: 0.18, label: 'Expert' },
};

function newGame(words, opts, version = 6) {
  const diff = DIFFICULTIES[opts.difficulty] || DIFFICULTIES.medium;
  // Easy uses only simple, everyday answers (flag at index 3 of a word entry, up to 5 letters).
  let pool = words;
  if (diff.simple) {
    const simple = words.filter((w) => w[3] === 1 && w[0].length <= 5);
    if (simple.length >= 150) pool = simple;
  }
  const puzzle = generatePuzzle(pool, opts.seed, diff.tier, version >= 5);
  const st = {
    v: 1,
    wordBankVersion: version,
    wordListSize: words.length,
    seed: opts.seed,
    difficulty: DIFFICULTIES[opts.difficulty] ? opts.difficulty : 'medium',
    daily: opts.daily || '',
    mode: opts.mode === 'solo' ? 'solo' : 'ai',
    skill: diff.skill,
    puzzle,
    locked: new Array(puzzle.cells.length).fill(0), // 0 open, 1 player, 2 opponent, 3 given at start, 4 revealed after giving up
    done: new Array(puzzle.entries.length).fill(0), // completed entry owner
    rack: [],
    aiRack: [],
    pending: {}, // cell index -> letter tentatively placed this turn
    selected: null, // selected rack index
    hint: null,
    scores: { p: 0, a: 0 },
    hints: MAX_HINTS,
    turn: 'player',
    over: false,
    winner: null,
    rng: createRng((Math.imul(opts.seed | 0, 2246822519) + 99) >>> 0),
  };
  prefill(st, diff.given);
  drawTiles(st, 'rack');
  return st;
}

// Reveal some letters at the start (state 3). Rules: every answer of 4+ letters gets at least one
// revealed letter, and no answer is ever fully revealed (each keeps at least one open square).
function prefill(st, fraction) {
  const { cells, entries, cellEntries } = st.puzzle;
  const letterIdx = [];
  cells.forEach((c, i) => {
    if (c.t === 'L') letterIdx.push(i);
  });
  const target = Math.max(entries.length, Math.round(letterIdx.length * fraction));
  const openIn = (e) => e.cells.filter((i) => !st.locked[i]).length;
  const canReveal = (idx) => !st.locked[idx] && cellEntries[idx].every((ei) => openIn(entries[ei]) > 1);
  let count = 0;
  const order = shuffleInPlace(st.rng, entries.map((e, i) => i));
  for (const ei of order) {
    const e = entries[ei];
    if (e.len < 4 || e.cells.some((i) => st.locked[i] === 3)) continue;
    const opts = shuffleInPlace(st.rng, e.cells.filter(canReveal));
    if (opts.length) {
      st.locked[opts[0]] = 3;
      count++;
    }
  }
  const rest = shuffleInPlace(st.rng, letterIdx.slice());
  for (const idx of rest) {
    if (count >= target) break;
    if (canReveal(idx)) {
      st.locked[idx] = 3;
      count++;
    }
  }
}

function unsolvedIdx(st) {
  const out = [];
  st.puzzle.cells.forEach((c, i) => {
    if (c.t === 'L' && !st.locked[i]) out.push(i);
  });
  return out;
}

function unsolvedCount(st) {
  return unsolvedIdx(st).length;
}

// Draw letters from the multiset of still-unsolved letters, excluding letters already held.
function drawTiles(st, which) {
  const counts = {};
  for (const i of unsolvedIdx(st)) {
    const ch = st.puzzle.cells[i].ch;
    counts[ch] = (counts[ch] || 0) + 1;
  }
  const sub = (ch) => {
    if (counts[ch] > 0) counts[ch]--;
  };
  st.rack.forEach(sub);
  st.aiRack.forEach(sub);
  Object.values(st.pending).forEach(sub);
  const bag = [];
  for (const ch of Object.keys(counts)) for (let k = 0; k < counts[ch]; k++) bag.push(ch);
  shuffleInPlace(st.rng, bag);
  const rack = st[which];
  while (rack.length < RACK_SIZE && bag.length) rack.push(bag.pop());
}

function lockedCount(st, entry) {
  let n = 0;
  for (const i of entry.cells) if (st.locked[i]) n++;
  return n;
}

// How close the most-advanced entry through this cell is to completion.
function cellProgress(st, idx) {
  let best = 0;
  for (const ei of st.puzzle.cellEntries[idx]) {
    const e = st.puzzle.entries[ei];
    best = Math.max(best, (lockedCount(st, e) + 1) / e.len);
  }
  return best;
}

function sweepCompleted(st, who) {
  const done = [];
  st.puzzle.entries.forEach((e, i) => {
    if (!st.done[i] && e.cells.every((ix) => st.locked[ix])) {
      st.done[i] = who;
      done.push(i);
    }
  });
  return done;
}

function bonusFor(st, done) {
  let b = 0;
  for (const i of done) b += st.puzzle.entries[i].len;
  if (done.length >= 2) b += 3;
  return b;
}

function finishIfOver(st) {
  if (unsolvedCount(st) > 0) return false;
  st.over = true;
  st.turn = 'none';
  if (st.mode === 'solo') st.winner = 'player';
  else st.winner = st.scores.p > st.scores.a ? 'player' : st.scores.a > st.scores.p ? 'ai' : 'draw';
  return true;
}

function canAct(st) {
  return !!st && !st.over && st.turn === 'player';
}

function selectTile(st, i) {
  if (!canAct(st) || i < 0 || i >= st.rack.length) return false;
  st.selected = st.selected === i ? null : i;
  st.hint = null;
  return true;
}

function recall(st, idx) {
  if (st.pending[idx] === undefined) return false;
  st.rack.push(st.pending[idx]);
  delete st.pending[idx];
  st.selected = null;
  return true;
}

function recallAll(st) {
  for (const k of Object.keys(st.pending)) recall(st, +k);
  st.selected = null;
}

// Tap on a letter cell: recall a pending tile or place the selected rack tile.
function tapCell(st, idx) {
  if (!canAct(st)) return 'none';
  const cell = st.puzzle.cells[idx];
  if (!cell || cell.t !== 'L' || st.locked[idx]) return 'none';
  if (st.pending[idx] !== undefined) {
    recall(st, idx);
    return 'recalled';
  }
  if (st.selected === null || st.selected >= st.rack.length) return 'none';
  st.pending[idx] = st.rack.splice(st.selected, 1)[0];
  st.selected = null;
  st.hint = null;
  return 'placed';
}

function pendingCount(st) {
  return Object.keys(st.pending).length;
}

function shuffleRack(st) {
  if (!canAct(st)) return false;
  shuffleInPlace(st.rng, st.rack);
  st.selected = null;
  st.hint = null;
  return true;
}

function submit(st) {
  if (!canAct(st)) return null;
  const keys = Object.keys(st.pending).map(Number);
  st.hint = null;
  st.selected = null;
  if (!keys.length) {
    st.rack = [];
    drawTiles(st, 'rack');
    if (st.mode === 'ai') st.turn = 'ai';
    return { type: 'pass', correct: 0, wrong: 0, points: 0, completed: [], over: false, correctCells: [], wrongs: [] };
  }
  let correct = 0;
  let wrong = 0;
  const correctCells = [];
  const wrongs = [];
  for (const idx of keys) {
    const letter = st.pending[idx];
    if (st.puzzle.cells[idx].ch === letter && !st.locked[idx]) {
      st.locked[idx] = 1;
      correct++;
      correctCells.push(idx);
    } else {
      st.rack.push(letter);
      wrong++;
      wrongs.push({ idx, letter });
    }
  }
  st.pending = {};
  const completed = sweepCompleted(st, 1);
  const points = correct + bonusFor(st, completed);
  st.scores.p += points;
  const over = finishIfOver(st);
  if (!over) {
    drawTiles(st, 'rack');
    if (st.mode === 'ai') st.turn = 'ai';
  }
  return { type: 'submit', correct, wrong, points, completed, over, correctCells, wrongs };
}

function useHint(st) {
  if (!canAct(st) || st.hints <= 0) return null;
  let best = null;
  st.rack.forEach((ch, ti) => {
    for (const idx of unsolvedIdx(st)) {
      if (st.pending[idx] !== undefined || st.puzzle.cells[idx].ch !== ch) continue;
      const score = cellProgress(st, idx) + st.rng() * 0.01;
      if (!best || score > best.score) best = { idx, tile: ti, score };
    }
  });
  if (!best) return null;
  st.hints--;
  st.hint = { idx: best.idx, tile: best.tile };
  st.selected = best.tile;
  return st.hint;
}

// ---- give up: reveal the remaining answers one square at a time (driven by the UI) ----------
function giveUp(st) {
  if (!st || st.over || st.gaveUp) return null;
  recallAll(st);
  st.gaveUp = true;
  st.turn = 'none';
  st.selected = null;
  st.hint = null;
  const order = [];
  const seen = new Set();
  for (const e of st.puzzle.entries) {
    for (const i of e.cells) {
      if (!st.locked[i] && !seen.has(i)) {
        seen.add(i);
        order.push(i);
      }
    }
  }
  return order;
}

function revealCell(st, idx) {
  if (st.gaveUp && !st.locked[idx] && st.puzzle.cells[idx].t === 'L') st.locked[idx] = 4;
}

function finishGiveUp(st) {
  unsolvedIdx(st).forEach((i) => revealCell(st, i));
  st.over = true;
  st.turn = 'none';
  st.winner = st.mode === 'solo' ? 'gaveup' : 'ai';
  st.puzzle.entries.forEach((e, i) => {
    if (!st.done[i]) st.done[i] = 3;
  });
}

function aiTurn(st) {
  if (st.over || st.turn !== 'ai') return null;
  st.aiRack = [];
  drawTiles(st, 'aiRack');
  const tiles = st.aiRack.slice();
  st.aiRack = [];
  let placed = 0;
  let missed = 0;
  for (const tile of tiles) {
    const cands = unsolvedIdx(st).filter((i) => st.puzzle.cells[i].ch === tile);
    if (!cands.length || st.rng() >= st.skill) {
      missed++;
      continue;
    }
    let top = -1;
    let pool = [];
    for (const i of cands) {
      const p = cellProgress(st, i);
      if (p > top + 1e-9) {
        top = p;
        pool = [i];
      } else if (Math.abs(p - top) < 1e-9) pool.push(i);
    }
    const choice = pool[Math.floor(st.rng() * pool.length)];
    st.locked[choice] = 2;
    placed++;
  }
  const completed = sweepCompleted(st, 2);
  const points = placed + bonusFor(st, completed);
  st.scores.a += points;
  const over = finishIfOver(st);
  if (!over) {
    st.turn = 'player';
    drawTiles(st, 'rack');
  }
  return { placed, missed, points, completed, over };
}

// ---- persistence -------------------------------------------------------------------------
function serialize(st) {
  return {
    v: 1,
    wordBankVersion: st.wordBankVersion,
    wordListSize: st.wordListSize,
    seed: st.seed,
    difficulty: st.difficulty,
    daily: st.daily,
    mode: st.mode,
    rack: st.rack,
    aiRack: st.aiRack,
    pending: st.pending,
    locked: st.locked,
    done: st.done,
    scores: st.scores,
    hints: st.hints,
    turn: st.turn,
    over: st.over,
    winner: st.winner,
    rngState: st.rng.getState(),
  };
}

const easyUntilVersion5 = new Set(["ROACH", "RODEO", "BEAMS"]);

function restore(words, d, onReplaced) {
  try {
    if (!d || d.v !== 1 || d.over) return null;
    // Older saves used the original 948 entries and must rebuild the same board.
    const wordListSize = d.wordListSize === undefined ? 948 : d.wordListSize;
    if (!Number.isInteger(wordListSize) || wordListSize < 948 || wordListSize > words.length) return null;
    const version = d.wordBankVersion ?? 1;
    if (![1, 2, 3, 4, 5, 6].includes(version)) return null;
    let pool = words.slice(0, wordListSize);
    if (version <= 5) {
      pool = pool.map(([word, clue, pic, flag, withText], i) => {
        const hadPicture = version === 5 &&
          (parseInt(version5Pictures[i >> 2], 16) & (8 >> (i % 4)));
        return [word, clue, version === 5 ? (hadPicture ? '1' : '') : pic,
          easyUntilVersion5.has(word) ? 1 : flag, withText];
      });
    }
    if (version < 4) {
      pool = pool.map(row => previousRows.get(row[0]) ||
        (previouslyEasy.has(row[0]) ? [row[0], row[1], row[2], 1] : row));
    }
    if (version === 1 && wordListSize > 3000) pool = pool.map(row => originalAnswers.get(row[0]) || row);
    if (version < 3 && d.difficulty === 'easy') {
      pool = pool.map(row => row[3] === 2 ? [row[0], row[1], row[2], 1] : row);
    }
    const options = { seed: d.seed, difficulty: d.difficulty, mode: d.mode, daily: d.daily };
    const st = newGame(pool, options, version);
    if (version < 4) {
      const allowed = new Set(words.map(row => row[0]));
      if (st.puzzle.entries.some(entry => !allowed.has(entry.word))) {
        const replacement = newGame(words, options);
        if (onReplaced) onReplaced();
        return replacement;
      }
    }
    if (version <= 5) {
      const current = new Map(words.map(row => [row[0], row]));
      for (const entry of st.puzzle.entries) {
        const row = current.get(entry.word);
        if (row) {
          entry.clue = row[1];
          entry.pic = row[2];
          entry.withText = row[4] === 1;
          entry.paired = row[4] === 2;
        }
      }
    }
    if (!Array.isArray(d.locked) || d.locked.length !== st.locked.length) return null;
    st.locked = d.locked.slice();
    st.done = Array.isArray(d.done) && d.done.length === st.done.length ? d.done.slice() : st.done;
    st.rack = Array.isArray(d.rack) ? d.rack.slice() : [];
    st.aiRack = [];
    st.pending = d.pending && typeof d.pending === 'object' ? { ...d.pending } : {};
    st.scores = { p: d.scores.p | 0, a: d.scores.a | 0 };
    st.hints = d.hints | 0;
    st.turn = d.turn === 'ai' ? 'ai' : 'player';
    st.rng.setState(d.rngState | 0);
    return st;
  } catch (e) {
    return null;
  }
}

// ---- storage.js
// Versioned localStorage wrappers. Every access is guarded: storage can be unavailable or full.
const KEYS = {
  save: 'crosswordtime.save.v1',
  stats: 'crosswordtime.stats.v1',
  settings: 'crosswordtime.settings.v1',
};

function backend(store) {
  if (store) return store;
  try {
    return globalThis.localStorage || null;
  } catch (e) {
    return null;
  }
}

function loadJSON(key, store) {
  try {
    const s = backend(store);
    const raw = s && s.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveJSON(key, value, store) {
  try {
    const s = backend(store);
    if (!s) return false;
    s.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

function removeKey(key, store) {
  try {
    const s = backend(store);
    if (s) s.removeItem(key);
  } catch (e) {
    /* ignore */
  }
}

function defaultStats() {
  return { played: 0, wins: 0, losses: 0, draws: 0, solo: 0, gaveUp: 0, streak: 0, bestStreak: 0, letters: 0, bestScore: 0, daily: {} };
}

function recordResult(stats, game) {
  const s = Object.assign(defaultStats(), stats || {});
  s.daily = Object.assign({}, s.daily);
  s.played++;
  s.letters += game.locked.filter((v) => v === 1).length;
  s.bestScore = Math.max(s.bestScore, game.scores.p);
  if (game.gaveUp) {
    s.gaveUp++;
    s.streak = 0;
    if (game.mode !== 'solo') s.losses++;
  } else if (game.mode === 'solo') {
    s.solo++;
  } else if (game.winner === 'player') {
    s.wins++;
    s.streak++;
    s.bestStreak = Math.max(s.bestStreak, s.streak);
  } else if (game.winner === 'ai') {
    s.losses++;
    s.streak = 0;
  } else {
    s.draws++;
  }
  if (game.daily) s.daily[game.daily] = !game.gaveUp && (game.mode === 'solo' || game.winner === 'player') ? 'win' : 'played';
  return s;
}

// ---- audio.js
// Sound effects synthesised with the Web Audio API: no audio files, no third-party licences.
let ctx = null;
let enabled = true;

function setSoundEnabled(v) {
  enabled = !!v;
  if (!enabled) stopBeat();
}

function unlockAudio() {
  try {
    if (!ctx) {
      const AC = globalThis.AudioContext || globalThis.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
  } catch (e) {
    ctx = null;
  }
}

function tone(freq, start, dur, type, vol) {
  const t0 = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}

function slide(f0, f1, start, dur, type, vol) {
  const t0 = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(f0, t0);
  osc.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.03);
}

const SOUNDS = {
  boing: () => { slide(200, 700, 0, 0.18, 'sine', 0.16); slide(700, 260, 0.18, 0.22, 'sine', 0.12); },
  toot: () => [392, 392, 523].forEach((f, i) => tone(f, i * 0.13, 0.12, 'sawtooth', 0.07)),
  whistle: () => slide(600, 1600, 0, 0.35, 'sine', 0.09),
  wah: () => { slide(311, 294, 0, 0.3, 'sawtooth', 0.08); slide(294, 277, 0.32, 0.3, 'sawtooth', 0.08); slide(277, 262, 0.64, 0.3, 'sawtooth', 0.08); slide(262, 180, 0.96, 0.6, 'sawtooth', 0.08); },
  select: () => tone(620, 0, 0.07, 'triangle', 0.12),
  place: () => tone(420, 0, 0.09, 'triangle', 0.14),
  recall: () => tone(330, 0, 0.07, 'triangle', 0.1),
  correct: () => [523, 659, 784].forEach((f, i) => tone(f, i * 0.07, 0.14, 'sine', 0.14)),
  wrong: () => {

function sfx(name) {

  try {

    /* audio is optional */
  }

// ---- dance beat: a small synthesised groove (drums, bass and a pentatonic jingle) under each dance --------------------
// Everything is scheduled up-front on one gain bus so that stopBeat() can silence it instantly.
let bus = null;

const PENTA = [0, 2, 4, 7, 9, 12, 14, 16]; // major pentatonic offsets in semitones
const STYLE_PATTERNS = {
  //          kick            snare/clap     hat                 bass steps         jingle steps
  pop:    { k: [0, 4],       s: [2, 6],       h: [0, 1, 2, 3, 4, 5, 6, 7], b: [0, 3, 4, 7], j: [1, 5, 7] },
  disco:  { k: [0, 2, 4, 6], s: [2, 6],       h: [1, 3, 5, 7],             b: [1, 3, 5, 7], j: [0, 3, 6] },
  latin:  { k: [0, 4, 7],    s: [3, 6],       h: [0, 1, 2, 3, 4, 5, 6, 7], b: [0, 3, 4, 7], j: [1, 2, 5, 6] },
  funk:   { k: [0, 3, 6],    s: [2, 6],       h: [0, 1, 2, 3, 4, 5, 6, 7], b: [0, 3, 5, 6], j: [3, 7] },
  swing:  { k: [0, 4],       s: [2, 6],       h: [0, 2, 3, 4, 6, 7],       b: [0, 2, 4, 6], j: [1, 5], swing: true },
  march:  { k: [0, 4],       s: [2, 3, 6, 7], h: [],                       b: [0, 2, 4, 6], j: [0, 4] },
  hiphop: { k: [0, 5],       s: [2, 6],       h: [0, 1, 2, 3, 4, 5, 6, 7], b: [0, 5],       j: [3, 7] },
};

function hashStr(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
  return h >>> 0;
}

function noiseBuf() {
  const len = Math.floor(ctx.sampleRate * 0.25);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  return buf;
}

function stopBeat() {
  if (!bus || !ctx) return;
  try {
    bus.gain.cancelScheduledValues(ctx.currentTime);
    bus.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
    const b = bus;
    setTimeout(() => { try { b.disconnect(); } catch (e) { /* already gone */ } }, 200);
  } catch (e) { /* audio is optional */ }
  bus = null;
}

// Schedules the groove for dance d: starts delayMs from now, lasts ms. d = {bpm, s: style, n: name}
function playBeat(d, ms, delayMs) {
  if (!enabled) return;
  try {
    if (!ctx) unlockAudio();
    if (!ctx) return;
    stopBeat();
    const pat = STYLE_PATTERNS[d.s] || STYLE_PATTERNS.pop;
    const out = ctx.createGain();
    out.gain.value = 0.9;
    out.connect(ctx.destination);
    bus = out;
    const hsh = hashStr(d.n || 'x');
    const root = [98, 110, 123.5, 130.8, 146.8][hsh % 5];
    const mode = [0, 3, 5, 7][(hsh >> 3) % 4]; // chord shift every other bar
    const beat = 60 / d.bpm;
    const step = beat / 2;
    const t0 = ctx.currentTime + (delayMs || 0) / 1000;
    const end = t0 + ms / 1000;
    const noise = noiseBuf();
    const hz = (semi) => root * Math.pow(2, semi / 12);
    const voice = (freq, t, dur, type, vol) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + dur + 0.03);
    };
    const hit = (t, dur, vol, filt, freq) => {
      const src = ctx.createBufferSource();
      const f = ctx.createBiquadFilter();
      const g = ctx.createGain();
      src.buffer = noise;
      f.type = filt;
      f.frequency.value = freq;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(out);
      src.start(t); src.stop(t + dur + 0.02);
    };
    const kick = (t) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      g.gain.setValueAtTime(0.32, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.2);
    };
    for (let n = 0; ; n++) {
      const bar = Math.floor(n / 8);
      const i = n % 8;
      let t = t0 + n * step;
      if (t >= end) break;
      if (pat.swing && i % 2 === 1) t += step / 3;
      if (pat.k.includes(i)) kick(t);
      if (pat.s.includes(i)) {
        if (d.s === 'march') hit(t, 0.07, 0.18, 'highpass', 1800);
        else { hit(t, 0.11, 0.2, 'bandpass', 1900); voice(190, t, 0.07, 'triangle', 0.06); }
      }
      if (pat.h.includes(i)) hit(t, i % 2 ? 0.05 : 0.03, i % 2 ? 0.09 : 0.06, 'highpass', 7000);
      const chord = bar % 2 ? mode : 0;
      if (pat.b.includes(i)) voice(hz(chord) / (d.s === 'march' && i % 4 === 2 ? 1 : 2), t, step * 0.9, d.s === 'march' ? 'triangle' : 'square', 0.07);
      if (pat.j.includes(i)) {
        const note = PENTA[(hsh >> (i + bar)) % PENTA.length] + chord;
        voice(hz(note + 12), t, step * 0.8, 'triangle', 0.07);
      }
    }
    out.gain.setValueAtTime(0.9, end - 0.15);
    out.gain.linearRampToValueAtTime(0.0001, end);
  } catch (e) {
    /* audio is optional */
  }
}

// ---- choreo.js
// Dance model v2 (pure functions, no DOM).
// A pose has 25 values (PARAMS). A dance is a routine of "moves" performed on the beat at a given tempo (bpm);
// each move is a short cyclic sequence of key poses (in beats). Moves can be mirrored (token suffix "~").
const PARAMS = [
  'x', 'y', 'rot', 'sx', 'sy', // whole body: shift, hop (negative = up), tilt, squash/stretch
  'px', 'py', 'tilt', 'lean', 'cw', // pelvis sway, pelvis drop (knee bend), hip tilt, torso lean, chest width (twist)
  'shL', 'shR', 'neck', 'head', 'hat', // shoulder shrugs (negative = up), neck stretch (vertical), head tilt, hat tilt
  'aL', 'eL', 'aR', 'eR', 'hL', 'hR', // shoulder angle (0 down, 90 out, 180 up), elbow bend, wrist flick
  'xL', 'yL', 'xR', 'yR', // feet: sideways offset and lift (negative = lifted)
];
const N = PARAMS.length;
const IDX = Object.fromEntries(PARAMS.map((k, i) => [k, i]));
const REST_OBJ = { sx: 1, sy: 1, cw: 1, aL: 8, eL: 6, aR: 8, eR: 6 };
const LIMITS_OBJ = {
  x: [-34, 34], y: [-34, 10], rot: [-35, 35], sx: [0.7, 1.35], sy: [0.65, 1.35],
  px: [-16, 16], py: [-6, 22], tilt: [-22, 22], lean: [-28, 28], cw: [0.35, 1.1],
  shL: [-9, 9], shR: [-9, 9], neck: [-5, 5], head: [-40, 40], hat: [-40, 40],
  aL: [-40, 200], eL: [-140, 160], aR: [-40, 200], eR: [-140, 160], hL: [-70, 70], hR: [-70, 70],
  xL: [-30, 30], yL: [-28, 3], xR: [-30, 30], yR: [-28, 3],
};
const LIMITS = PARAMS.map((k) => LIMITS_OBJ[k]);
const REST = PARAMS.map((k) => REST_OBJ[k] ?? 0);
const STYLES = ['pop', 'disco', 'latin', 'funk', 'swing', 'march', 'hiphop'];

// rig geometry shared with the renderer
const THIGH = 26;
const SHIN = 26;
const HIP_X = 10;
const WAIST_Y = -58;
const ANKLE_Y = -6;
const FOOT_X = 11;

function poseFrom(obj) {
  return PARAMS.map((k, i) => (obj[k] !== undefined ? obj[k] : REST[i]));
}

function clampPose(p) {
  return p.map((v, i) => Math.max(LIMITS[i][0], Math.min(LIMITS[i][1], v)));
}

function lerpPose(a, b, w) {
  return a.map((v, i) => v + (b[i] - v) * w);
}

function ease(f, mode) {
  return mode === 1 ? 1 - Math.pow(1 - f, 3) : (1 - Math.cos(Math.PI * f)) / 2;
}

const SWAP = { shL: 'shR', shR: 'shL', aL: 'aR', aR: 'aL', eL: 'eR', eR: 'eL', hL: 'hR', hR: 'hL', yL: 'yR', yR: 'yL' };
const NEG = new Set(['x', 'rot', 'px', 'tilt', 'lean', 'head', 'hat']);

function mirrorPose(p) {
  const out = new Array(N);
  PARAMS.forEach((k, i) => {
    if (k === 'xL') out[i] = -p[IDX.xR];
    else if (k === 'xR') out[i] = -p[IDX.xL];
    else if (SWAP[k]) out[i] = p[IDX[SWAP[k]]];
    else out[i] = NEG.has(k) ? -p[i] : p[i];
  });
  return out;
}

// ---- legs: two-bone IK in the root frame (y down). Returns angles in degrees and a length scale. ----
function legIK(hipX, hipY, footX, footY, left) {
  const u = (left ? -1 : 1) * (footX - hipX); // outward distance
  const v = footY - hipY; // downward distance
  let d = Math.hypot(u, v);
  const reach = (THIGH + SHIN) * 1.12;
  if (d > reach) d = reach;
  if (d < 6) d = 6;
  const s = d > THIGH + SHIN ? d / (THIGH + SHIN) : 1;
  const L = THIGH * s;
  const alpha = Math.acos(Math.min(1, d / (2 * L)));
  const beta = Math.atan2(u, v);
  const deg = 180 / Math.PI;
  return { a: (beta + alpha) * deg, k: -2 * alpha * deg, s, d };
}

// Where the pelvis/hips and feet are for a pose (root frame); used by the renderer and by plausibility tests.
function legTargets(p) {
  const th = (p[IDX.tilt] * Math.PI) / 180;
  const px = p[IDX.px];
  const py = WAIST_Y + p[IDX.py];
  const c = Math.cos(th);
  const s = Math.sin(th);
  return {
    hipL: [px - HIP_X * c, py - HIP_X * s],
    hipR: [px + HIP_X * c, py + HIP_X * s],
    footL: [-FOOT_X + p[IDX.xL], ANKLE_Y + p[IDX.yL]],
    footR: [FOOT_X + p[IDX.xR], ANKLE_Y + p[IDX.yR]],
  };
}

// ---- moves ----------------------------------------------------------------------------------
let MOVE_LIB = {};
const prepared = new WeakMap();

function registerMoves(m) {
  MOVE_LIB = m;
}
function getMoves() {
  return MOVE_LIB;
}

function prep(mv) {
  let pr = prepared.get(mv);
  if (!pr) {
    const keys = mv.k.map(([t, o]) => [t, poseFrom(o)]).sort((a, b) => a[0] - b[0]);
    pr = { keys, len: mv.len, e: mv.e || 0 };
    prepared.set(mv, pr);
  }
  return pr;
}

// Pose of a move at local time tb (beats, 0..len); cyclic.
function movePose(mv, tb) {
  const { keys, len, e } = prep(mv);
  const t = ((tb % len) + len) % len;
  let i = keys.length - 1;
  for (let j = 0; j < keys.length; j++) if (keys[j][0] <= t) i = j;
  const a = keys[i];
  const b = i + 1 < keys.length ? keys[i + 1] : [len + keys[0][0], keys[0][1]];
  const span = b[0] - a[0];
  const f = span > 0 ? (t - a[0]) / span : 0;
  return lerpPose(a[1], b[1], ease(Math.min(1, Math.max(0, f)), e));
}

function parseToken(tok) {
  const mir = tok.endsWith('~');
  const name = mir ? tok.slice(0, -1) : tok;
  return { name, mir, mv: MOVE_LIB[name] };
}

function routineBeats(d) {
  return d.m.reduce((s, tok) => s + (parseToken(tok).mv ? parseToken(tok).mv.len : 0), 0);
}

function beatMs(d) {
  return 60000 / d.bpm;
}

function loopMs(d) {
  return routineBeats(d) * beatMs(d);
}

const XF = 0.4; // beats of cross-fade into the next move
function segPose(seg, local) {
  const p = movePose(seg.mv, local);
  return seg.mir ? mirrorPose(p) : p;
}

// Pose of dance d at time tMs since the dance started (loops through its routine).
function samplePose(d, tMs) {
  const seq = d.m.map(parseToken);
  const total = seq.reduce((s, x) => s + x.mv.len, 0);
  const b = tMs / beatMs(d);
  const bb = ((b % total) + total) % total;
  let acc = 0;
  let j = 0;
  for (; j < seq.length; j++) {
    if (bb < acc + seq[j].mv.len) break;
    acc += seq[j].mv.len;
  }
  if (j >= seq.length) j = seq.length - 1;
  const local = bb - acc;
  let p = segPose(seq[j], local);
  const remain = seq[j].mv.len - local;
  if (remain < XF) {
    const next = seq[(j + 1) % seq.length];
    const w = 1 - remain / XF;
    p = lerpPose(p, segPose(next, 0), (1 - Math.cos(Math.PI * w)) / 2);
  }
  const amp = d.amp === undefined ? 1 : d.amp;
  if (amp !== 1) p = clampPose(p.map((v, i) => REST[i] + (v - REST[i]) * amp));
  return p;
}

// ---- validation and analysis ----------------------------------------------------------------
function validateMove(name, mv) {
  const errs = [];
  if (!mv || ![1, 2, 4].includes(mv.len)) errs.push('len must be 1, 2 or 4');
  if (!mv || !Array.isArray(mv.k) || mv.k.length < 2) return errs.concat('at least 2 keys');
  let last = -1;
  for (const [t, o] of mv.k) {
    if (!(t >= 0 && t < mv.len)) errs.push('key time ' + t + ' outside 0..' + mv.len);
    if (t <= last) errs.push('key times must increase');
    last = t;
    for (const k of Object.keys(o)) {
      if (!(k in IDX)) errs.push('unknown param ' + k);
      else if (!(o[k] >= LIMITS_OBJ[k][0] && o[k] <= LIMITS_OBJ[k][1])) errs.push(k + '=' + o[k] + ' outside ' + LIMITS_OBJ[k]);
    }
  }
  if (!mv.desc || mv.desc.length < 8) errs.push('needs a description');
  return errs;
}

function validateDance(d) {
  const errs = [];
  if (!d || typeof d !== 'object') return ['not an object'];
  if (typeof d.n !== 'string' || d.n.length < 3 || d.n.length > 32) errs.push('name length 3-32');
  if (typeof d.c !== 'string' || d.c.length < 4 || d.c.length > 60) errs.push('caption length 4-60');
  if (!Number.isFinite(d.bpm) || d.bpm < 96 || d.bpm > 140) errs.push('bpm 96-140');
  if (!STYLES.includes(d.s)) errs.push('style must be one of ' + STYLES.join(','));
  if (d.amp !== undefined && !(d.amp >= 0.7 && d.amp <= 1.5)) errs.push('amp 0.7-1.5');
  if (!Array.isArray(d.m) || d.m.length < 3 || d.m.length > 6) errs.push('3-6 move tokens');
  else {
    let beats = 0;
    for (const tok of d.m) {
      const { mv } = parseToken(String(tok));
      if (!mv) errs.push('unknown move ' + tok);
      else beats += mv.len;
    }
    if (beats < 6 || beats > 12) errs.push('routine must be 6-12 beats (is ' + beats + ')');
  }
  return errs;
}

const SPAN = LIMITS.map((l) => l[1] - l[0]);
const SAMPLES = 16;

function signature(d) {
  const total = routineBeats(d) * beatMs(d);
  const out = [];
  for (let k = 0; k < SAMPLES; k++) out.push(samplePose(d, (k / SAMPLES) * total));
  return out;
}

// Normalised mean absolute pose difference between two routines (ignores mirroring and start phase).
function danceDistance(a, b) {
  const sa = signature(a);
  const sb = signature(b);
  let best = Infinity;
  for (const mirror of [false, true]) {
    const sbm = mirror ? sb.map(mirrorPose) : sb;
    for (let shift = 0; shift < SAMPLES; shift += 2) {
      let sum = 0;
      for (let k = 0; k < SAMPLES; k++) {
        const pa = sa[k];
        const pb = sbm[(k + shift) % SAMPLES];
        for (let j = 0; j < N; j++) sum += Math.abs(pa[j] - pb[j]) / SPAN[j];
      }
      best = Math.min(best, sum / (SAMPLES * N));
    }
  }
  return best;
}

function motionAmount(d) {
  const sig = signature(d);
  let total = 0;
  for (let j = 0; j < N; j++) {
    let lo = Infinity;
    let hi = -Infinity;
    for (const p of sig) {
      lo = Math.min(lo, p[j]);
      hi = Math.max(hi, p[j]);
    }
    total += (hi - lo) / SPAN[j];
  }
  return total;
}

// ---- mascot.js
// Jester mascot: an original character drawn as an SVG rig and animated by pose interpolation.

const NS = 'http://www.w3.org/2000/svg';
const C = { purple: '#6b3fa0', gold: '#f2b01e', teal: '#14a3a0', red: '#d9443a', skin: '#ffe6cc', ink: '#2a1a3a', white: '#ffffff' };

function S(tag, attrs, ...kids) {
  const el = document.createElementNS(NS, tag);
  for (const k of Object.keys(attrs || {})) el.setAttribute(k, attrs[k]);
  for (const kid of kids.flat()) if (kid) el.append(kid);
  return el;
}

function limbLine(y2, color, width) {
  return S('line', { x1: 0, y1: 0, x2: 0, y2, stroke: color, 'stroke-width': width, 'stroke-linecap': 'round' });
}

function makeArm(right) {
  const hand = S('g', {},
    right ? S('g', { 'data-prop': 'thumb' }, S('rect', { x: -2.8, y: 2, width: 5.6, height: 12, rx: 2.8, fill: C.white, stroke: C.ink, 'stroke-width': 1.4 })) : null,
    S('circle', { cx: 0, cy: 1, r: 5.8, fill: C.white, stroke: C.ink, 'stroke-width': 1.6 }),
    S('ellipse', { cx: 4.5, cy: 6, rx: 2.2, ry: 3.4, fill: C.white, stroke: C.ink, 'stroke-width': 1.2, transform: 'rotate(-25 4.5 6)' }));
  const lower = S('g', {}, limbLine(20, right ? C.purple : C.gold, 7), S('g', { transform: 'translate(0 20)' }, hand));
  const upper = S('g', {}, limbLine(22, right ? C.gold : C.purple, 8), lower);
  return { upper, lower, hand: hand.parentNode };
}

function makeLeg(right) {
  const foot = S('g', {},
    S('path', { d: 'M-6,-1 C-8,8 4,10 14,3 C16,1 13,0 10,1 L6,-2 Z', fill: right ? C.red : C.teal, stroke: C.ink, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }),
    S('circle', { cx: 14.5, cy: 2.5, r: 2.6, fill: C.gold, stroke: C.ink, 'stroke-width': 1 }));
  const footBox = S('g', { transform: 'translate(0 26)' }, foot);
  const shin = S('g', {}, limbLine(26, right ? C.purple : C.gold, 8), footBox);
  const thigh = S('g', {}, limbLine(26, right ? C.gold : C.purple, 9), shin);
  return { thigh, shin, foot: footBox };
}

function brow(d) {
  return S('path', { d, fill: 'none', stroke: C.ink, 'stroke-width': 2, 'stroke-linecap': 'round' });
}

function build() {
  const armL = makeArm(false);
  const armR = makeArm(true);
  const legL = makeLeg(false);
  const legR = makeLeg(true);

  const hornL = S('path', { d: 'M-8,-137 C-22,-140 -31,-148 -31,-162', fill: 'none', stroke: C.purple, 'stroke-width': 9, 'stroke-linecap': 'round' });
  const hornR = S('path', { d: 'M8,-137 C22,-140 31,-148 31,-162', fill: 'none', stroke: C.gold, 'stroke-width': 9, 'stroke-linecap': 'round' });
  const hat = S('g', {},
    hornL, hornR,
    S('path', { d: 'M-5,-138 C-3,-148 3,-148 5,-138', fill: 'none', stroke: C.teal, 'stroke-width': 8, 'stroke-linecap': 'round' }),
    S('circle', { cx: -31, cy: -165, r: 4.6, fill: C.gold, stroke: C.ink, 'stroke-width': 1.4 }),
    S('circle', { cx: 31, cy: -165, r: 4.6, fill: C.red, stroke: C.ink, 'stroke-width': 1.4 }),
    S('circle', { cx: 0, cy: -149, r: 3.6, fill: C.red, stroke: C.ink, 'stroke-width': 1.2 }),
    S('rect', { x: -15, y: -140, width: 30, height: 6, rx: 3, fill: C.red, stroke: C.ink, 'stroke-width': 1.4 }));

  const eye = (cx) => [
    S('ellipse', { cx, cy: -124, rx: 3.8, ry: 4.4, fill: C.white, stroke: C.ink, 'stroke-width': 1.2 }),
    S('circle', { cx, cy: -123.4, r: 2, fill: C.ink }),
  ];
  const tear = (cx) => S('path', { class: 'tear', d: 'M' + cx + ',-119 q-3,5 0,8 q3,-3 0,-8 z', fill: '#4fb3ff', stroke: '#1f7acb', 'stroke-width': 0.8 });
  const face = S('g', {},
    S('circle', { cx: -18, cy: -122, r: 3.6, fill: C.skin, stroke: C.ink, 'stroke-width': 1.4 }),
    S('circle', { cx: 18, cy: -122, r: 3.6, fill: C.skin, stroke: C.ink, 'stroke-width': 1.4 }),
    S('circle', { cx: 0, cy: -122, r: 18, fill: C.skin, stroke: C.ink, 'stroke-width': 1.8 }),
    S('circle', { cx: -11, cy: -116, r: 3.4, fill: '#ff9aa8', opacity: 0.7 }),
    S('circle', { cx: 11, cy: -116, r: 3.4, fill: '#ff9aa8', opacity: 0.7 }),
    S('g', { class: 'eyes' }, eye(-6.5), eye(6.5)),
    S('g', { 'data-m': 'happy cheer' }, brow('M-11,-131 Q-6.5,-134.5 -2.5,-131'), brow('M2.5,-131 Q6.5,-134.5 11,-131')),
    S('g', { 'data-m': 'sad cry' }, brow('M-11,-129 L-3,-133.5'), brow('M3,-133.5 L11,-129')),
    S('g', { 'data-m': 'puzzled' }, brow('M-11,-134 Q-6.5,-138.5 -2.5,-134'), brow('M3,-130 L10,-131.5')),
    S('circle', { cx: 0, cy: -118, r: 3.2, fill: C.red, stroke: C.ink, 'stroke-width': 1 }),
    S('path', { 'data-m': 'happy', d: 'M-7,-111.5 Q0,-105 7,-111.5', fill: 'none', stroke: C.ink, 'stroke-width': 2, 'stroke-linecap': 'round' }),
    S('g', { 'data-m': 'cheer' }, S('path', { d: 'M-9,-112.5 Q0,-98 9,-112.5 Z', fill: '#7a1f2b', stroke: C.ink, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }), S('path', { d: 'M-4,-107 Q0,-103 4,-107 Q0,-110 -4,-107', fill: '#ff7a8c' })),
    S('path', { 'data-m': 'sad', d: 'M-6,-107 Q0,-112.5 6,-107', fill: 'none', stroke: C.ink, 'stroke-width': 2, 'stroke-linecap': 'round' }),
    S('ellipse', { 'data-m': 'cry', cx: 0, cy: -107, rx: 5.2, ry: 4.8, fill: '#7a1f2b', stroke: C.ink, 'stroke-width': 1.6 }),
    S('path', { 'data-m': 'puzzled', d: 'M-6,-109 q3,-3 6,0 t6,0', fill: 'none', stroke: C.ink, 'stroke-width': 2, 'stroke-linecap': 'round' }),
    S('g', { 'data-m': 'cry' }, tear(-8), tear(8)),
    hat);

  const head = S('g', {}, face);
  const collar = [-9, -3, 3, 9].map((x) => S('circle', { cx: x, cy: -101, r: 5.6, fill: C.white, stroke: C.ink, 'stroke-width': 1.3 }));
  const sign = S('g', { 'data-prop': 'why' },
    S('rect', { x: -2, y: -26, width: 4, height: 28, rx: 2, fill: '#8a5a2b', stroke: C.ink, 'stroke-width': 1 }),
    S('rect', { x: -26, y: -58, width: 52, height: 34, rx: 4, fill: C.white, stroke: C.ink, 'stroke-width': 2.2 }),
    (() => { const t = S('text', { x: 0, y: -34.5, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 800, fill: C.red, 'font-family': 'system-ui, sans-serif' }); t.textContent = 'WHY?'; return t; })());
  const chest = S('g', {},
    S('path', { d: 'M0,-100 L-17,-100 L-14,-58 L0,-58 Z', fill: C.purple, stroke: C.ink, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }),
    S('path', { d: 'M0,-100 L17,-100 L14,-58 L0,-58 Z', fill: C.gold, stroke: C.ink, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }),
    S('path', { d: 'M0,-92 l5,6 l-5,6 l-5,-6 z', fill: C.teal }),
    S('path', { d: 'M0,-78 l4,5 l-4,5 l-4,-5 z', fill: C.red }),
    S('rect', { x: -15, y: -67, width: 30, height: 5, fill: C.red, stroke: C.ink, 'stroke-width': 1 }),
    S('rect', { x: -3, y: -68, width: 6, height: 7, fill: C.gold, stroke: C.ink, 'stroke-width': 1 }),
    collar);
  const neck = S('g', {}, head);
  const armsG = S('g', {}, S('g', {}, armL.upper), S('g', {}, armR.upper));
  const torso = S('g', {}, chest, armsG, neck, sign);
  const pelvis = S('g', {},
    S('path', { d: 'M-14,-5 L0,-5 L0,8 L-12,8 Q-15,8 -15,4 Z', fill: C.purple, stroke: C.ink, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }),
    S('path', { d: 'M14,-5 L0,-5 L0,8 L12,8 Q15,8 15,4 Z', fill: C.gold, stroke: C.ink, 'stroke-width': 1.6, 'stroke-linejoin': 'round' }));

  const shadow = S('ellipse', { cx: 80, cy: 188, rx: 30, ry: 5, fill: 'rgba(0,0,0,.18)' });
  const root = S('g', {}, S('g', {}, legL.thigh), S('g', {}, legR.thigh), pelvis, torso);
  const svg = S('svg', { viewBox: '-10 -16 180 216', class: 'mascot', role: 'img', 'aria-label': 'Jester mascot', 'data-face': 'happy', 'data-prop': '' }, shadow, root);
  return { svg, root, torso, chest, neck, head, hat, armL, armR, legL, legR, pelvis, shadow, sign };
}

function sobPose(t) {
  const shake = Math.sin(t / 85);
  return poseFrom({
    y: 3 + Math.abs(Math.sin(t / 130)) * -4, sx: 1.03, sy: 0.95, py: 5, lean: -8 + Math.sin(t / 240) * 3,
    head: 16 + Math.sin(t / 200) * 5, hat: 10 + Math.sin(t / 150) * 6, neck: 3,
    shL: -6 + shake * 2, shR: -6 - shake * 2,
    aL: 150 + shake * 3, eL: 100 + shake * 4, aR: 150 - shake * 3, eR: 100 - shake * 4, hL: 20, hR: -20,
    xL: -4, xR: 4,
  });
}

const THUMBS = poseFrom({ y: -4, lean: 4, head: -4, hat: -6, aL: 12, eL: 8, aR: 160, eR: -15, xL: -4, xR: 4, hR: 0 });

function whyPose(t) {
  return poseFrom({
    y: Math.sin(t / 500) * 1.5, lean: -4 + Math.sin(t / 700) * 2, head: 14 + Math.sin(t / 900) * 4, hat: 12 + Math.sin(t / 600) * 5,
    shL: -3, shR: -3, aL: 70 + Math.sin(t / 420) * 6, eL: 70, aR: 142, eR: 16, xL: -4, xR: 4, px: Math.sin(t / 800) * 2,
  });
}

function idlePose(t) {
  const p = REST.slice();
  p[IDX.y] += Math.sin(t / 650) * 1.4;
  p[IDX.head] = Math.sin(t / 1300) * 3;
  p[IDX.hat] = Math.sin(t / 900) * 4;
  p[IDX.aL] += Math.sin(t / 800) * 3;
  p[IDX.aR] += Math.sin(t / 800 + 1) * 3;
  p[IDX.py] = 1 + Math.sin(t / 650) * 1.2;
  p[IDX.xL] = -2;
  p[IDX.xR] = 2;
  return p;
}

function createMascot() {
  const r = build();
  const el = r.svg;
  let track = null;
  let raf = 0;
  let t0 = 0;
  let propNow = '';

  function setFace(f) { el.setAttribute('data-face', f); }
  function setProp(p) { propNow = p; el.setAttribute('data-prop', p); }

  const f1 = (v) => Math.round(v * 100) / 100;
  function apply(pose) {
    const p = clampPose(pose);
    const g = (k) => p[IDX[k]];
    const cw = g('cw');
    const lean = g('lean');
    const sx = g('sx');
    const sy = g('sy');
    r.root.setAttribute('transform', 'translate(' + f1(80 + g('x')) + ' ' + f1(186 + g('y')) + ') rotate(' + f1(g('rot')) + ') scale(' + f1(sx) + ' ' + f1(sy) + ')');
    const px = g('px');
    const py = g('py');
    // pelvis (hips) and legs
    r.pelvis.setAttribute('transform', 'translate(' + f1(px) + ' ' + f1(WAIST_Y + py) + ') rotate(' + f1(g('tilt')) + ')');
    const T = legTargets(p);
    for (const side of ['L', 'R']) {
      const left = side === 'L';
      const hip = left ? T.hipL : T.hipR;
      const foot = left ? T.footL : T.footR;
      const ik = legIK(hip[0], hip[1], foot[0], foot[1], left);
      const leg = left ? r.legL : r.legR;
      leg.thigh.setAttribute('transform', 'translate(' + f1(hip[0]) + ' ' + f1(hip[1]) + ')' + (left ? '' : ' scale(-1 1)') + ' rotate(' + f1(ik.a) + ') scale(1 ' + f1(ik.s) + ')');
      leg.shin.setAttribute('transform', 'translate(0 26) rotate(' + f1(ik.k) + ')');
      leg.foot.setAttribute('transform', 'translate(0 26) rotate(' + f1(-(ik.a + ik.k) * 0.9) + ') scale(1 ' + f1(1 / ik.s) + ')');
    }
    // chest follows the pelvis only partly, so hips and chest can move against each other
    r.torso.setAttribute('transform', 'translate(' + f1(px * 0.55) + ' ' + f1(py * 0.9) + ') translate(0 -58) rotate(' + f1(lean) + ') translate(0 58)');
    r.chest.setAttribute('transform', 'scale(' + f1(cw) + ' 1)');
    r.neck.setAttribute('transform', 'translate(0 ' + f1(g('neck')) + ')');
    r.head.setAttribute('transform', 'translate(0 -104) rotate(' + f1(g('head')) + ') translate(0 104)');
    r.hat.setAttribute('transform', 'translate(0 -136) rotate(' + f1(g('hat')) + ') translate(0 136)');
    const sh = 17 * cw;
    const shLy = -98 + g('shL');
    const shRy = -98 + g('shR');
    r.armL.upper.setAttribute('transform', 'translate(' + f1(-sh) + ' ' + f1(shLy) + ') rotate(' + f1(g('aL')) + ')');
    r.armL.lower.setAttribute('transform', 'translate(0 22) rotate(' + f1(g('eL')) + ')');
    r.armL.hand.setAttribute('transform', 'translate(0 20) rotate(' + f1(g('hL')) + ')');
    r.armR.upper.setAttribute('transform', 'translate(' + f1(sh) + ' ' + f1(shRy) + ') scale(-1 1) rotate(' + f1(g('aR')) + ')');
    r.armR.lower.setAttribute('transform', 'translate(0 22) rotate(' + f1(g('eR')) + ')');
    r.armR.hand.setAttribute('transform', 'translate(0 20) rotate(' + f1(g('hR')) + ')');
    r.shadow.setAttribute('rx', String(Math.max(16, 30 + Math.min(0, g('y')) * 0.35)));
    if (propNow === 'why') {
      // keep the sign upright in the right hand (forward kinematics of the right arm)
      const d = Math.PI / 180;
      const aR = g('aR');
      const eR = g('eR');
      const hx = sh + 22 * Math.sin(aR * d) + 21 * Math.sin((aR + eR) * d);
      const hy = shRy + 22 * Math.cos(aR * d) + 21 * Math.cos((aR + eR) * d);
      r.sign.setAttribute('transform', 'translate(' + f1(hx) + ' ' + f1(hy) + ') rotate(' + f1(-lean) + ')');
    }
  }

  function loop(now) {
    raf = 0;
    if (!track && !el.isConnected) return;
    const t = Math.max(0, now - t0); // rAF timestamps can precede performance.now() taken in start()
    if (track) {
      apply(track.fn(t));
      if (track.dur !== undefined && t >= track.dur) {
        const done = track.done;
        track = null;
        setFace('happy');
        setProp('');
        if (done) done();
      }
    } else apply(idlePose(now));
    raf = requestAnimationFrame(loop);
  }

  function kick() {
    if (!raf) raf = requestAnimationFrame(loop);
  }

  function start(tr) {
    track = tr;
    t0 = performance.now();
    setFace(tr.face);
    setProp(tr.prop || '');
    apply(tr.fn(0));
    kick();
  }

  const reduce = () => typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

  apply(REST);
  kick();

  return {
    el,
    apply,
    // thumbs-up count-in, then dance `d` (on its own beat) for `ms` milliseconds in total
    dance(d, ms, done) {
      if (reduce()) {
        start({ face: 'cheer', prop: 'thumb', dur: ms, done, fn: () => THUMBS });
        return;
      }
      const PRE = Math.round(beatMs(d)); // one-beat count-in (thumbs up), then the routine starts on beat 1
      const OUT = 300;
      start({ face: 'cheer', prop: 'thumb', dur: ms, done, fn: (t) => {
        if (t < PRE) {
          const w = ease(Math.min(1, t / 200));
          const p = lerpPose(REST, THUMBS, w);
          p[1] += Math.sin(t / 60) * 1.2;
          return p;
        }
        if (propNow === 'thumb') setProp('');
        const dt = t - PRE;
        const base = samplePose(d, dt);
        let p = lerpPose(THUMBS, base, ease(Math.min(1, dt / 200)));
        if (t > ms - OUT) p = lerpPose(p, REST, ease(Math.min(1, (t - (ms - OUT)) / OUT)));
        return p;
      } });
    },
    // endless victory dancing through a list of dances
    victory(list, perMs) {
      start({ face: 'cheer', prop: '', fn: (t) => samplePose(list[Math.floor(t / perMs) % list.length], t % perMs) });
    },
    cry(ms, done) {
      start({ face: 'cry', prop: '', dur: ms, done, fn: reduce() ? () => sobPose(0) : sobPose });
    },
    sob() {
      start({ face: 'cry', prop: '', fn: reduce() ? () => sobPose(0) : sobPose });
    },
    why() {
      start({ face: 'puzzled', prop: 'why', fn: reduce() ? () => whyPose(0) : whyPose });
    },
    // freeze on a given pose (used for reduced motion and for design review sheets)
    hold(pose, face) {
      start({ face: face || 'happy', prop: '', fn: () => pose });
    },
    idle(face) {
      track = null;
      setFace(face || 'happy');
      setProp('');
      kick();
    },
    stop() {
      track = null;
    },
    get face() { return el.getAttribute('data-face'); },
  };
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function startApp(words, dances, moves) {

  const settings = Object.assign({ sound: true, vibrate: true, mascot: true }, loadJSON(KEYS.settings) || {});

  const hasSave = () => {
    const d = loadJSON(KEYS.save);
    return !!(d && d.v === 1 && !d.over);

  const persist = () => {
    if (game && !game.over && !game.gaveUp) saveJSON(KEYS.save, serialize(game));
    else removeKey(KEYS.save);

    }
  };
  // ---- jester mascot -----------------------------------------------------------------------
  const mascot = createMascot();
  const DANCE_MS = 4000;
  const CRY_MS = 2400;
  const FUNNY_SOBS = ['Oh noooo!', 'That hurt my hat!', 'My bells are heartbroken.', 'Waaah! Not like that!', 'I tried to be brave...', 'Even my shoes are sad.', 'Boo-hoo-hoo!', 'Sniff... try again?', 'My makeup is running!'];
  let stage = null; // {kind: 'dance'|'cry'|'sob', title, line, sub, skippable}
  let stageTimer = 0;
  let afterStage = null;
  let danceDeck = [];
  let danceCount = 0;
  const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // every dance is shown once (in random order) before any repeats
  function nextDance() {
    if (!danceDeck.length) {
      danceDeck = dances.map((_, i) => i);
      for (let i = danceDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [danceDeck[i], danceDeck[j]] = [danceDeck[j], danceDeck[i]];
      }
    }
    danceCount++;
    return dances[danceDeck.pop()];
  }

  function clearStage() {
    clearTimeout(stageTimer);
    stopBeat();
    stage = null;
    afterStage = null;
  }

  function startStage(kind, sub) {
    if (!settings.mascot || !dances.length) return false;
    clearTimeout(stageTimer);
    let ms;
    if (kind === 'dance') {
      const d = nextDance();
      stage = { kind, title: d.n, line: d.c, sub, skippable: true };
      mascot.dance(d, DANCE_MS);
      const pre = Math.round(beatMs(d));
      sfx(['boing', 'toot', 'whistle'][danceCount % 3]);
      playBeat(d, DANCE_MS - pre - 250, pre);
      ms = DANCE_MS;
    } else {
      stage = { kind: 'cry', title: pickOne(FUNNY_SOBS), line: '', sub, skippable: true };
      mascot.cry(CRY_MS);
      sfx('wah');
      ms = CRY_MS;
    }
    stageTimer = setTimeout(endStage, ms + 60);
    render();
    return true;
  }

  function endStage() {
    clearTimeout(stageTimer);
    stopBeat();
    const cb = afterStage;
    afterStage = null;
    stage = null;
    mascot.idle();
    render();
    if (cb) cb();
  }

  function mascotForResult() {
    if (!settings.mascot) return;
    if (game.gaveUp || game.winner === 'ai') {
      mascot.sob();
      sfx('wah');
    } else if (game.winner === 'draw') mascot.idle('happy');
    else if (dances.length) {
      mascot.victory([nextDance(), nextDance(), nextDance()], 2800);
      sfx('toot');
    } else mascot.idle('cheer');
  }

  function toast(msg) {
    toastMsg = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastMsg = '';
      render();
    }, 2600);
  }

  // ---- flow ------------------------------------------------------------------------------
  function begin(opts) {
    unlockAudio();
    try {
      game = newGame(words, opts);
    } catch (e) {
      toast('Could not create a puzzle. Please try again.');
      render();
      return;
    }
    clearStage();
    mascot.idle();
    focus = null;
    sheet = null;
    busy = false;
    fx.ok = {};
    fx.word = {};
    fx.bad = {};
    persist();
    render();
  }

  // Remove one batch of transient marks after `ms` (one timer and one re-render per submit).
  function clearFxLater(t, ms) {
    setTimeout(() => {
      for (const k of ['ok', 'word', 'bad']) for (const i of Object.keys(fx[k])) if (fx[k][i].t === t) delete fx[k][i];
      render();
    }, ms);
  }

  // Coins jump out of the newly filled squares and fly to the player's score (one per point).
  function spawnCoins(cellIdxs, count) {
    if (!cellIdxs.length || !count) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const board = root.querySelector('.board');
    const target = root.querySelector('.sc.me');
    if (!board || !target || !layer.animate) return;
    const tr = target.getBoundingClientRect();
    const tx = tr.left + tr.width / 2;
    const ty = tr.top + tr.height / 2;
    const n = Math.min(count, 30);
    for (let k = 0; k < n; k++) {
      const cell = board.children[cellIdxs[k % cellIdxs.length]];
      if (!cell) continue;
      const r = cell.getBoundingClientRect();
      const sx = r.left + r.width / 2;
      const sy = r.top + r.height / 2;
      const el = h('span', { class: 'coin' }, '\u2605');
      el.style.left = sx - 10 + 'px';
      el.style.top = sy - 10 + 'px';
      layer.append(el);
      const dx = (Math.random() - 0.5) * 130;
      const up = 50 + Math.random() * 70;
      const anim = el.animate([
        { transform: 'translate(0,0) scale(.3)', opacity: 0 },
        { transform: 'translate(' + dx * 0.5 + 'px,' + -up + 'px) scale(1.2)', opacity: 1, offset: 0.28 },
        { transform: 'translate(' + dx + 'px,' + -up * 0.35 + 'px) scale(1)', opacity: 1, offset: 0.5 },
        { transform: 'translate(' + (tx - sx) + 'px,' + (ty - sy) + 'px) scale(.5)', opacity: 0.2 },
      ], { duration: 1300, delay: k * 70, easing: 'ease-in-out', fill: 'both' });
      anim.onfinish = () => el.remove();
    }
    for (let k = 0; k < Math.min(n, 5); k++) setTimeout(() => sfx('coin'), 250 + k * 110);
  }

  function onSubmit() {
    if (!canAct(game) || busy) return;
    const res = submit(game);
    if (!res) return;
    if (res.type === 'pass') {
      toast('Tiles swapped. Turn passed.');
      sfx('turn');
    } else {
      if (res.correct) sfx(res.completed.length ? 'word' : 'correct');

    if (res.type === 'submit') {
      const t = performance.now();
      for (const i of res.correctCells) fx.ok[i] = { t };
      for (const ei of res.completed) for (const i of game.puzzle.entries[ei].cells) fx.word[i] = { t };
