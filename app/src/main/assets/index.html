    persist();
    render();
    if (res.type === 'submit' && res.correct) spawnCoins(res.correctCells, res.points);
    let staged = false;
    if (res.type === 'submit' && !game.over) {
      const good = res.correct > res.wrong;
      const words = res.completed.length ? ' \u00B7 ' + res.completed.length + (res.completed.length > 1 ? ' words' : ' word') : '';
      const sub = good ? '+' + res.points + ' points' + words : (res.correct ? res.correct + ' right, ' : '') + res.wrong + ' sent back';
      staged = startStage(good ? 'dance' : 'cry', sub);
    }
    if (game.over) return finish();
    if (game.turn === 'ai') {
      if (staged) afterStage = runAi;
      else runAi();
    }
  }

  function runAi() {
    busy = true;
    render();
    setTimeout(() => {
      if (!game || game.turn !== 'ai') {
        busy = false;
        return;
      }
      const r = aiTurn(game);
      busy = false;
      if (r) {
        if (r.placed) sfx(r.completed.length ? 'word' : 'correct');
        toast('Opponent placed ' + r.placed + (r.placed === 1 ? ' letter' : ' letters') + ' (+' + r.points + ')' + (r.completed.length ? ' and completed ' + r.completed.length + (r.completed.length > 1 ? ' words' : ' word') : ''));
        if (!r.over) setTimeout(() => sfx('turn'), 450);
      }
      persist();
      render();
      if (game.over) finish();
    }, 1200);
  }

  function finish() {
    stats = recordResult(stats, game);
    saveJSON(KEYS.stats, stats);
    removeKey(KEYS.save);
    const mine = game.mode === 'solo' || game.winner === 'player';
    sfx(game.winner === 'ai' ? 'lose' : 'win');
    if (mine) buzz([40, 40, 80]);
    setTimeout(() => {
      clearStage();
      sheet = 'result';
      mascotForResult();
      render();
    }, 700);
  }

  function doGiveUp() {
    const g = game;
    const order = giveUp(g);
    if (!order) return;
    sheet = null;
    clearStage();
    if (settings.mascot) {
      stage = { kind: 'sob', title: 'Boo-hoo-hoo\u2026', line: 'Showing you the answers\u2026', sub: '', skippable: false };
      mascot.sob();
      sfx('wah');
    }
    busy = true;
    stats = recordResult(stats, g);
    saveJSON(KEYS.stats, stats);
    removeKey(KEYS.save);
    render();
    let i = 0;
    const step = Math.max(90, Math.min(260, 6000 / Math.max(1, order.length)));
    const tick = () => {
      if (game !== g) return; // player left the screen; result already recorded
      if (i < order.length) {
        revealCell(g, order[i++]);
        if (i % 2 === 1) sfx('place');
        render();
        setTimeout(tick, step);
      } else {
        finishGiveUp(g);
        busy = false;
        sfx('lose');
        render();
        setTimeout(() => {
          if (game === g) {
            clearStage();
            sheet = 'result';
            mascotForResult();
            render();
          }
        }, 700);
      }
    };
    setTimeout(tick, 400);
  }

  function tapClue(entryIds) {
    const ids = entryIds.filter((i) => i >= 0);
    if (!ids.length) return;
    const at = ids.indexOf(focus);
    focus = ids[(at + 1) % ids.length];
    sfx('select');
    render();
  }

  function onCell(idx) {
    if (!game) return;
    const res = tapCell(game, idx);
    if (res === 'placed') {
      delete fx.bad[idx];
      sfx('place');
    }
    else if (res === 'recalled') sfx('recall');
    else {
      const ents = game.puzzle.cellEntries[idx];
      if (ents.length) {
        const at = ents.indexOf(focus);
        focus = ents[(at + 1) % ents.length];
      }
    }
    if (res !== 'none') persist();
    render();
  }

  // Pointer events support touch, stylus and mouse without replacing tap-to-place.
  let tileDrag = null;
  let suppressDragClickUntil = 0;

  function cancelTileDrag() {
    const d = tileDrag;
    tileDrag = null;
    if (!d) return;
    d.source.classList.remove('drag-source');
    if (d.target) d.target.classList.remove('drop-target');
    if (d.ghost) d.ghost.remove();
    if (d.source.hasPointerCapture(d.pointerId)) d.source.releasePointerCapture(d.pointerId);
    if (d.active) suppressDragClickUntil = performance.now() + 500;
  }

  function dropTarget(x, y) {
    if (!tileDrag || !tileDrag.ghost || game !== tileDrag.game || !canAct(game) || busy || sheet) return null;
    // Match the visible tile, including its offset above the finger. Update on
    // release too, since pointerup can arrive after the last pointermove.
    const ghost = tileDrag.ghost;
    ghost.style.left = x + 'px';
    ghost.style.top = y + 'px';
    const tile = ghost.getBoundingClientRect();
    let best = null;
    let bestOverlap = 0;
    let bestDistance = Infinity;
    for (const cell of root.querySelectorAll('.cell.letter[data-cell]')) {
      const idx = Number(cell.dataset.cell);
      if (game.locked[idx] || game.pending[idx] !== undefined) continue;
      const box = cell.getBoundingClientRect();
      if (box.width <= 0 || box.height <= 0) continue;
      const width = Math.max(0, Math.min(tile.right, box.right) - Math.max(tile.left, box.left));
      const height = Math.max(0, Math.min(tile.bottom, box.bottom) - Math.max(tile.top, box.top));
      const overlap = width * height / (box.width * box.height);
      if (overlap < 0.5) continue;
      const distance = Math.hypot((tile.left + tile.right - box.left - box.right) / 2,
        (tile.top + tile.bottom - box.top - box.bottom) / 2);
      if (overlap > bestOverlap || (overlap === bestOverlap && distance < bestDistance)) {
        best = cell;
        bestOverlap = overlap;
        bestDistance = distance;
      }
    }
    return best;
  }

  function startTileDrag(event, index) {
    if (!event.isPrimary || event.button !== 0 || tileDrag || !canAct(game) || busy || sheet) return;
    const source = event.currentTarget;
    tileDrag = { game, index, letter: game.rack[index], source, pointerId: event.pointerId,
      x: event.clientX, y: event.clientY, active: false, target: null, ghost: null };
    source.setPointerCapture(event.pointerId);
  }

  document.addEventListener('pointermove', (event) => {
    const d = tileDrag;
    if (!d || event.pointerId !== d.pointerId) return;
    if (game !== d.game || !canAct(game) || busy || sheet) { cancelTileDrag(); return; }
    if (!d.active) {
      if (Math.hypot(event.clientX - d.x, event.clientY - d.y) < 8) return;
      d.active = true;
      d.source.classList.add('drag-source');
      d.ghost = h('div', { class: 'tile drag-ghost', 'aria-hidden': 'true' }, d.letter);
      document.body.append(d.ghost);
      sfx('select');
    }
    event.preventDefault();
    const target = dropTarget(event.clientX, event.clientY);
    if (d.target !== target) {
      if (d.target) d.target.classList.remove('drop-target');
      d.target = target;
      if (target) target.classList.add('drop-target');
    }
  }, { passive: false });

  document.addEventListener('pointerup', (event) => {
    const d = tileDrag;
    if (!d || event.pointerId !== d.pointerId) return;
    const target = d.active ? dropTarget(event.clientX, event.clientY) : null;
    const idx = target ? Number(target.dataset.cell) : null;
    if (d.active) event.preventDefault();
    cancelTileDrag();
    if (idx !== null && game === d.game && game.rack[d.index] === d.letter) {
      game.selected = d.index;
      onCell(idx);
    }
  });
  document.addEventListener('pointercancel', (event) => {
    if (tileDrag && event.pointerId === tileDrag.pointerId) cancelTileDrag();
  });
  document.addEventListener('lostpointercapture', (event) => {
    if (tileDrag && event.pointerId === tileDrag.pointerId) cancelTileDrag();
  });
  window.addEventListener('blur', cancelTileDrag);
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelTileDrag(); });
  // A completed drag must not also trigger the tile/cell's normal click action.
  document.addEventListener('click', (event) => {
    if (event.detail && performance.now() < suppressDragClickUntil) {
      event.preventDefault();
      event.stopImmediatePropagation();
      suppressDragClickUntil = 0;
    }
  }, true);

  // ---- rendering -------------------------------------------------------------------------
  function cluePicture(entry, size) {
    if (entry.pic.startsWith('@')) {
      const key = entry.pic.slice(1);
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('class', 'clue-drawing');
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', clueIconPaths[key]);
      path.setAttribute('fill', clueSwatches[entry.word] || 'currentColor');
      if (key === 'swatch') {
        path.setAttribute('stroke', '#807a70');
        path.setAttribute('stroke-width', '.5');
      }
      svg.appendChild(path);
      return h('span', { class: size + (entry.paired ? ' pair-pic' : ''), 'aria-hidden': 'true' },
        svg, entry.paired ? svg.cloneNode(true) : null);
    }
    const night = entry.word === 'NIGHT' || entry.word === 'NIGHTS';
    const style = entry.paired ? ' pair-pic' : night ? ' moon-tile' :
      entry.word === 'SPIN' ? ' turning-dancer' : /^[0-9][0-9a-z,]+$/.test(entry.pic) ? ' number-pic' : '';
    return h('span', { class: size + style, 'aria-hidden': 'true' }, night ? '' : entry.pic);
  }

  function clueNode(ei, dir) {
    const e = game.puzzle.entries[ei];
    return h(
      'div',
      { class: 'part ' + dir + (game.done[ei] ? ' fin' : '') + (focus === ei ? ' foc' : ''), title: e.clue },
      e.pic && !e.withText ? cluePicture(e, 'pic') :
        h('span', { class: 'txt' }, e.pic ? cluePicture(e, 'inline-pic') : '', e.pic ? ' ' : '', e.clue),
      h('i', { class: 'arr ' + dir }, dir === 'A' ? '▸' : '▾')
    );
  }

  function renderCell(idx) {
    const cell = game.puzzle.cells[idx];
    if (cell.t === 'B') return h('div', { class: 'cell blank' });
    if (cell.t === 'C') {
      const parts = [];
      if (cell.a >= 0) parts.push(clueNode(cell.a, 'A'));
      if (cell.d >= 0) parts.push(clueNode(cell.d, 'D'));
      return h('div', { class: 'cell clue' + (parts.length > 1 ? ' two' : ''), onclick: () => tapClue([cell.a, cell.d]) }, parts);
    }
    const lk = game.locked[idx];
    const pend = game.pending[idx];
    const inFocus = focus !== null && game.puzzle.entries[focus].cells.includes(idx);
    const isHint = game.hint && game.hint.idx === idx;
    const cls = ['cell', 'letter'];
    if (lk === 1) cls.push('mine');
    if (lk === 2) cls.push('theirs');
    if (lk === 3) cls.push('given');
    if (lk === 4) cls.push('auto');
    if (pend !== undefined) cls.push('pend');
    if (inFocus) cls.push('focus');
    if (isHint) cls.push('hint');
    let ch = lk ? cell.ch : pend !== undefined ? pend : '';
    const fOk = lk ? fx.ok[idx] : null;
    const fWord = lk ? fx.word[idx] : null;
    const fBad = !lk && pend === undefined ? fx.bad[idx] : null;
    if (fOk) cls.push('flash-ok');
    if (fWord) cls.push('flash-word');
    if (fBad) {
      cls.push('bad');
      ch = fBad.letter;
    }
    const mark = fOk || fWord || fBad;
    // keep a running animation continuous across re-renders
    const style = mark ? 'animation-delay:-' + Math.round(performance.now() - mark.t) + 'ms' : null;
    return h('button', { class: cls.join(' '), style, 'data-cell': idx, 'aria-label': 'letter square', onclick: () => onCell(idx) }, ch);
  }

  function renderBoard() {
    const p = game.puzzle;
    const board = h('div', { class: 'board', style: '--cols:' + p.cols + ';--rows:' + p.rows });
    for (let i = 0; i < p.cells.length; i++) board.append(renderCell(i));
    return board;
  }

  function clueBar() {
    if (toastMsg) return h('div', { class: 'cluebar msg', role: 'status' }, toastMsg);
    if (focus === null) {
      const hasSel = game.selected !== null;
      return h('div', { class: 'cluebar tip' }, hasSel ? 'Now tap a white square to place the tile.' : 'Drag a tile to an empty square, or tap a tile then a square. Tap a clue to read it.');
    }
    const e = game.puzzle.entries[focus];
    return h('div', { class: 'cluebar' }, h('b', null, (e.dir === 'A' ? 'Across' : 'Down') + ' · ' + e.len + ' letters'), h('span', null, e.pic ? cluePicture(e, 'bar-pic') : '', e.pic ? ' ' : '', e.clue));
  }

  function renderRack() {
    const rack = h('div', { class: 'rack' + (canAct(game) ? '' : ' wait') });
    for (let i = 0; i < RACK_SIZE; i++) {
      const ch = game.rack[i];
      if (ch === undefined) {
        rack.append(h('div', { class: 'tile empty' }));
        continue;
      }
      const cls = 'tile' + (game.selected === i ? ' sel' : '') + (game.hint && game.hint.tile === i ? ' hinted' : '');
      rack.append(h('button', { class: cls, onpointerdown: (event) => startTileDrag(event, i), ondragstart: (event) => event.preventDefault(), oncontextmenu: (event) => event.preventDefault(), onclick: () => { if (selectTile(game, i)) { sfx('select'); render(); } } }, ch));
    }
    return rack;
  }

  function scoreBar() {
    const left = unsolvedCount(game);
    const total = game.puzzle.letterCount;
    const pct = Math.round(((total - left) / total) * 100);
    if (game.mode === 'solo') {
      return h('div', { class: 'scorebar' },
        h('div', { class: 'sc me active' }, h('small', null, 'Score'), h('strong', null, game.scores.p)),
        h('div', { class: 'turn' }, pct + '% solved'));
    }
    const mine = game.turn === 'player';
    const status = game.gaveUp ? (game.over ? 'Game over' : 'Revealing answers\u2026') : game.over ? 'Finished' : busy ? 'Opponent thinking\u2026' : mine ? 'Your turn' : '\u2026';
    return h('div', { class: 'scorebar' },
      h('div', { class: 'sc me' + (mine ? ' active' : '') }, h('small', null, 'You'), h('strong', null, game.scores.p)),
      h('div', { class: 'turn' + (busy ? ' think' : '') }, status, h('small', null, pct + '% solved')),
      h('div', { class: 'sc them' + (game.turn === 'ai' ? ' active' : '') }, h('small', null, 'Opponent'), h('strong', null, game.scores.a)));
  }

  function toggleMute() {
    settings.sound = !settings.sound;
    saveJSON(KEYS.settings, settings);
    setSoundEnabled(settings.sound); // muting also cuts any dance music that is playing
    if (settings.sound) { unlockAudio(); sfx('select'); } else stopBeat();
    render();
  }

  function gameScreen() {
    const my = canAct(game) && !busy;
    const pc = pendingCount(game);
    return h('div', { class: 'screen game' },
      h('header', { class: 'top' },
        h('button', { class: 'icon', 'aria-label': 'Home', onclick: () => { sheet = null; game = game && game.over ? null : game; persist(); showHome(); } }, '‹'),
        scoreBar(),
        h('button', { class: 'icon mute' + (settings.sound ? '' : ' off'), 'aria-label': settings.sound ? 'Mute sound' : 'Unmute sound', 'aria-pressed': settings.sound ? 'false' : 'true', title: settings.sound ? 'Mute' : 'Unmute', onclick: toggleMute }, settings.sound ? '\u{1F50A}' : '\u{1F507}'),
        h('button', { class: 'icon', 'aria-label': 'Give up', title: 'Give up', disabled: !canAct(game) || busy, onclick: () => { sheet = 'giveup'; if (settings.mascot) { mascot.why(); sfx('hint'); } render(); } }, '\u2691'),
        h('button', { class: 'icon', 'aria-label': 'Settings', onclick: () => { sheet = 'settings'; render(); } }, '⚙')),
      h('div', { class: 'boardwrap' }, renderBoard()),
      h('div', { class: 'bottom' }, bottomArea(my, pc)));
  }

  // Bottom area: controls normally; a docked panel (never an overlay) for give-up, settings and results,
  // so the board and scores always stay fully visible.
  function bottomArea(my, pc) {
    if (sheet === 'giveup') return giveUpDock();
    if (sheet === 'result') return resultDock();
    if (sheet === 'settings') return settingsDock();
    if (stage) return stagePanel();
    return [
      clueBar(),
      renderRack(),
      h('div', { class: 'actions' },
        h('button', { class: 'btn ghost', disabled: !my || game.hints <= 0, onclick: () => { const r = useHint(game); if (r) { sfx('hint'); } else toast('No hint available right now.'); render(); } }, 'Hint (' + game.hints + ')'),
        h('button', { class: 'btn ghost', disabled: !my, onclick: () => { shuffleRack(game); sfx('select'); render(); } }, 'Shuffle'),
        h('button', { class: 'btn ghost', disabled: !my || !pc, onclick: () => { recallAll(game); sfx('recall'); persist(); render(); } }, 'Recall'),
        h('button', { class: 'btn primary', disabled: !my, onclick: onSubmit }, pc ? 'Submit (' + pc + ')' : 'Pass')),
    ];
  }

  function dock(title, sub, buttons, withMascot) {
    const body = [
      h('div', { class: 'dock-title' }, title),
      sub ? h('p', { class: 'dock-sub' }, sub) : null,
      h('div', { class: 'dock-btns' }, buttons),
    ];
    if (withMascot && settings.mascot) {
      const box = h('div', { class: 'mbox' });
      box.append(mascot.el);
      return h('div', { class: 'dock with-mascot', role: 'dialog', 'aria-label': title }, box, h('div', { class: 'dock-body' }, body));
    }
    return h('div', { class: 'dock', role: 'dialog', 'aria-label': title }, body);
  }

  function stagePanel() {
    const box = h('div', { class: 'mbox' });
    box.append(mascot.el);
    return h('div', { class: 'stage ' + stage.kind, role: 'status', onclick: () => { if (stage && stage.skippable) endStage(); } },
      box,
      h('div', { class: 'cap' },
        h('div', { class: 'ttl' }, stage.title),
        stage.line ? h('div', { class: 'sub' }, stage.line) : null,
        stage.sub ? h('div', { class: 'sub' }, stage.sub) : null,
        stage.skippable ? h('div', { class: 'tap' }, 'Tap to skip') : null));
  }

  function giveUpDock() {
    return dock('Give up this game?', 'The answers will fill in and this counts as a loss.', [
      h('button', { class: 'btn danger', onclick: doGiveUp }, 'Give up'),
      h('button', { class: 'btn primary', onclick: () => { sheet = null; mascot.idle(); render(); } }, 'Keep playing'),
    ], true);
  }

  function settingsDock() {
    const chip = (label, key, after) => h('button', { class: 'btn ghost chip' + (settings[key] ? ' on' : ''), 'aria-pressed': settings[key] ? 'true' : 'false', onclick: () => {
      settings[key] = !settings[key];
      saveJSON(KEYS.settings, settings);
      if (after) after();
      if (key === 'sound' && settings.sound) { unlockAudio(); sfx('select'); }
      render();
    } }, label + ': ' + (settings[key] ? 'On' : 'Off'));
    return dock('Settings', null, [
      chip('Sound', 'sound', () => setSoundEnabled(settings.sound)),
      chip('Vibration', 'vibrate'),
      chip('Mascot', 'mascot'),
      h('button', { class: 'btn primary', onclick: () => { sheet = null; render(); } }, 'Close'),
    ]);
  }

  function resultDock() {
    const solo = game.mode === 'solo';
    const win = solo || game.winner === 'player';
    const draw = game.winner === 'draw';
    const title = game.gaveUp ? (solo ? 'Puzzle revealed' : 'You gave up') : solo ? 'Puzzle solved!' : draw ? 'It\u2019s a draw' : win ? 'You win!' : 'Opponent wins';
    const sub = solo ? 'Score ' + game.scores.p : 'You ' + game.scores.p + '  \u2013  Opponent ' + game.scores.a;
    return dock(title, sub, [
      h('button', { class: 'btn primary', onclick: () => {
        const d = game.daily ? null : game.difficulty;
        if (!d) { sheet = null; showHome(); return; }
        begin({ seed: Math.floor(Math.random() * 1e9) + 1, difficulty: d, mode: game.mode });
      } }, game.daily ? 'Back to menu' : 'Play again'),
      game.daily ? null : h('button', { class: 'btn ghost', onclick: () => { sheet = null; showHome(); } }, 'Menu'),
    ], true);
  }

  function titleTiles() {
    const row = (text, size, shift) =>
      h('div', { class: 'row' }, text.split('').map((c, i) => h('span', { class: 'tt ' + size + ' t' + ((i + shift) % 3) }, c)));
    return h('div', { class: 'title' }, row('CROSSWORD', 'sm', 0), row('TIME', 'lg', 1));
  }

  function homeScreen() {
    const todayDone = stats.daily && stats.daily[todayKey()];
    return h('div', { class: 'screen home' },
      titleTiles(),
      h('p', { class: 'tag' }, 'A turn-based crossword duel'),
      h('div', { class: 'menu' },
        hasSave() ? h('button', { class: 'btn primary big', onclick: resume }, 'Continue game') : null,
        h('button', { class: hasSave() ? 'btn big' : 'btn primary big', onclick: () => { sheet = 'play'; render(); } }, 'Play vs opponent'),
        h('button', { class: 'btn big', onclick: () => { sheet = 'solo'; render(); } }, 'Solo puzzle'),
        h('button', { class: 'btn big', onclick: () => begin({ seed: todayKey(), difficulty: 'medium', mode: 'ai', daily: String(todayKey()) }) }, 'Daily puzzle', todayDone ? h('span', { class: 'chk' }, todayDone === 'win' ? ' ✓' : ' •') : null),
        h('div', { class: 'row2' },
          h('button', { class: 'btn ghost', onclick: () => { sheet = 'stats'; render(); } }, 'Statistics'),
          h('button', { class: 'btn ghost', onclick: () => { sheet = 'howto'; render(); } }, 'How to play'),
          h('button', { class: 'btn ghost', onclick: () => { sheet = 'settings'; render(); } }, 'Settings'))));
  }

  function resume() {
    unlockAudio();
    let replaced = false;
    const st = restore(words, loadJSON(KEYS.save), () => { replaced = true; });
    if (!st) {
      removeKey(KEYS.save);
      toast('Saved game could not be restored.');
      return render();
    }
    game = st;
    if (replaced) {
      persist();
      toast('A word in your saved puzzle was retired. Here is a fresh puzzle.');
    }
    focus = null;
    sheet = null;
    render();
    if (game.turn === 'ai') runAi();
  }

  function showHome() {
    clearStage();
    mascot.idle();
    game = null;
    render();
  }

  function sheetBox(title, body, onClose) {
    return h('div', { class: 'overlay', onclick: (e) => { if (e.target.classList.contains('overlay') && onClose !== false) { sheet = null; render(); } } },
      h('div', { class: 'sheet', role: 'dialog', 'aria-label': title },
        h('h2', null, title), body,
        onClose === false ? null : h('button', { class: 'btn ghost close', onclick: () => { sheet = null; render(); } }, 'Close')));
  }

  function difficultySheet(mode) {
    const seed = () => Math.floor(Math.random() * 1e9) + 1;
    return sheetBox(mode === 'solo' ? 'Solo puzzle' : 'Choose difficulty',
      h('div', { class: 'list' },
        Object.keys(DIFFICULTIES).map((k) => h('button', { class: 'btn big', onclick: () => begin({ seed: seed(), difficulty: k, mode }) },
          DIFFICULTIES[k].label, h('small', null, mode === 'solo' ? ['Small', 'Medium', 'Large', 'Largest'][DIFFICULTIES[k].tier] + ' grid' : 'Opponent skill ' + Math.round(DIFFICULTIES[k].skill * 100) + '%')))));
  }

  function howSheet() {
    return sheetBox('How to play', h('div', { class: 'prose' },
      h('p', null, 'Fill the grid. Some letters are already filled in to get you started. Each clue square points (▸ across or ▾ down) to the answer that starts in the next square.'),
      h('p', null, h('b', null, 'Your turn. '), 'Drag a letter tile onto an empty white square, or tap a tile then tap a square to place it. Tap a placed tile to return it to your rack. Place as many as you like, then press Submit. Correct letters lock in (1 point each); wrong ones return to your rack.'),
      h('p', null, h('b', null, 'Bonuses. '), 'Completing a word scores its length in extra points. Finishing two or more words in one turn adds 3 more.'),
      h('p', null, h('b', null, 'Opponent. '), 'After you submit, the opponent plays its own turn. Whoever has the most points when the grid is full wins.'),
      h('p', null, h('b', null, 'Help. '), 'Hint highlights a tile and a square that match (3 per game). Pass swaps your tiles and skips your turn. Games save automatically.'),
      h('p', null, h('b', null, 'Give up. '), 'Tap the flag at the top of the game screen to give up: the remaining squares fill in with the right letters and the game counts as a loss.')));
  }

  function statsSheet() {
    const rows = [['Games played', stats.played], ['Wins', stats.wins], ['Losses', stats.losses], ['Draws', stats.draws], ['Solo puzzles solved', stats.solo], ['Games given up', stats.gaveUp], ['Current win streak', stats.streak], ['Best win streak', stats.bestStreak], ['Best score', stats.bestScore], ['Letters placed', stats.letters]];
    return sheetBox('Statistics', h('table', { class: 'stats' }, rows.map((r) => h('tr', null, h('td', null, r[0]), h('td', null, r[1])))));
  }

  function settingsSheet() {
    const toggle = (label, key, after) => h('label', { class: 'toggle' }, h('span', null, label),
      h('input', { type: 'checkbox', checked: settings[key] ? true : null, onchange: (e) => { settings[key] = e.target.checked; saveJSON(KEYS.settings, settings); if (after) after(); if (key === 'sound' && settings.sound) { unlockAudio(); sfx('select'); } } }));
    return sheetBox('Settings', h('div', { class: 'list' },
      toggle('Sound effects', 'sound', () => setSoundEnabled(settings.sound)),
      toggle('Vibration', 'vibrate'),
      toggle('Jester mascot', 'mascot'),
      h('button', { class: 'btn ghost', onclick: () => {
        if (!confirmReset) { confirmReset = true; render(); return; }
        confirmReset = false; stats = defaultStats(); saveJSON(KEYS.stats, stats); toast('Statistics reset.'); render();
      } }, confirmReset ? 'Tap again to confirm reset' : 'Reset statistics'),
      h('p', { class: 'small' }, 'Crossword Time 1.0 · original puzzles and clues · sounds synthesised on-device.')));
  }

  function render() {
    cancelTileDrag();
    root.replaceChildren();
    root.append(game ? gameScreen() : homeScreen());
    if (sheet === 'play') root.append(difficultySheet('ai'));
    else if (sheet === 'solo') root.append(difficultySheet('solo'));
    else if (sheet === 'howto') root.append(howSheet());
    else if (sheet === 'stats') root.append(statsSheet());
    else if (sheet === 'settings' && !game) root.append(settingsSheet());
    if (toastMsg && !game) root.append(h('div', { class: 'toast', role: 'status' }, toastMsg));
  }

  window.__cw = { get game() { return game; }, get stage() { return stage; }, words, dances, moves, mascot, createMascot, samplePose, loopMs, beatMs, DANCE_MS, get settings() { return settings; } };
  render();
}

startApp(WORDS, DANCES, MOVES);
})();
</script>
