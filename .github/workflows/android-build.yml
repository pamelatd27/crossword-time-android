name: Android APK and AAB

on:
  push:
    branches: [main, master, feature2.0]
  pull_request:
    branches: [main, master, feature2.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"


      - name: Generate six approved dance pose frames for distinct routines
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('app/src/main/assets/approved_dancer.gif')
          assert source.exists(), 'Approved character asset is missing'
          im = Image.open(source)
          frames = []
          for i in range(im.n_frames):
              im.seek(i)
              frames.append(im.convert('RGB').copy())
          assert len(frames) == 6, f'Expected 6 approved poses, got {len(frames)}'
          w, h = frames[0].size
          strip = Image.new('RGB', (w * len(frames), h))
          for i, image in enumerate(frames):
              strip.paste(image, (i * w, 0))
          dest = source.with_name('approved_dancer_strip.png')
          strip.save(dest, optimize=True)
          print(f'Created {dest} ({strip.width} x {strip.height})')
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK and unsigned release AAB
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crossword-time-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crossword-time-unsigned-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
